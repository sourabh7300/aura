services:
  - type: web
    name: aura-secure-backend
    runtime: node
    plan: free
    rootDir: aura-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AI_KEY_PRIMARY
        sync: false          # set privately in the hosting dashboard
      - key: AI_KEY_BACKUP
        sync: false          # optional additional keys, comma-separated
      - key: AI_KEY_RESERVE
        sync: false          # optional third brain
      - key: AI_KEY_VISION
        sync: false          # optional — enables image understanding
      - key: RATE_LIMIT
        value: "30"
      - key: ALLOW_ORIGINS
        value: "https://sourabh7300.github.io,https://anna.partners,https://www.anna.partners"
      - key: SECRET
        sync: false          # optional private gate key — owner tools present it as X-AURA-Key
      # REAL SEARCH (29 Oct 2026): with one of these set, every "latest …" question is
      # answered from ranked results instead of news headlines. Priority: tavily → brave → exa.
      - key: TAVILY_API_KEY
        sync: false          # tavily.com → API keys
      # KEY BANK (1 Nov 2026): one dev key = 1,000 credits/month at 100 RPM, so a
      # second key takes over the moment the first drains or gets rate-limited.
      - key: TAVILY_API_KEY_2
        sync: false          # backup key — comma-separated lists work too
      - key: TAVILY_MONTHLY_CREDITS
        value: "1000"        # credits per key per month; raise it when the plan is
      - key: TAVILY_STRATEGY
        value: "spread"      # spread = round-robin (default) · drain = empty one first
      - key: TAVILY_RPM
        value: "100"         # dev key 100 · production key 1000
      - key: BRAVE_SEARCH_API_KEY
        sync: false          # api.search.brave.com subscription token
      - key: EXA_API_KEY
        sync: false          # dashboard.exa.ai

      # OWNER ORDER 16 Oct 2026: "nonstop kaam — ChatGPT-Astra-class jab tak".
      # Phase-3 ChatGPT-parity roadmap ON, 30 cycle/din, 20-min tick.
      - key: SQUAD_NONSTOP
        value: "1"
      - key: SQUAD_CYCLES_PER_DAY
        value: "30"
      - key: SQUAD_TICK_MINUTES
        value: "20"
