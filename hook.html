       wake word used to retrigger itself */
    if(P.listening){ V.timer = setTimeout(wakeListen, 1200); return; }
    if(window.speechSynthesis && speechSynthesis.speaking){ V.timer = setTimeout(wakeListen, 900); return; }
    try{ if(V.rec){ V.rec.onend = null; V.rec.onerror = null; V.rec.abort(); } }catch(e){}
    var r = new SR(); V.rec = r;
    r.lang = "en-IN"; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    var fired = false;
    r.onresult = function(ev){
      var heard = "";
      for(var i = ev.resultIndex; i < ev.results.length; i++) heard += ev.results[i][0].transcript;
      V.heard = heard;
      if(!fired && WAKE.test(heard)){
        fired = true;
        try{ r.onend = null; r.abort(); }catch(e){}
        wakeUp(heard);
      }
    };
    r.onend = function(){ if(V.armed && !V.awake) V.timer = setTimeout(wakeListen, 600); };
    r.onerror = function(e){
      var why = (e && e.error) || "";
      if(/not-allowed|service-not-allowed/.test(why)){
        V.armed = false; clearTimeout(V.timer);
        /* a silent auto-arm must never trap a visitor in a "mic blocked" toast they did
           not ask for: stay quiet, leave the preference unset, and let an explicit tap
           or the sheet's own button ask properly */
        if(V.silent){ V.silent = false; label(); ui(false); return; }
        V.denied = true;
        try{ localStorage.setItem("aura_wake", "0"); }catch(err){}
        ui("off", "Mic off — allow it in settings"); label(); return;
      }
      if(/network|audio-capture/.test(why)){
        if(V.silent){ V.armed = false; V.silent = false; clearTimeout(V.timer); label(); ui(false); return; }
        ui("off", navigator.onLine ? "Microphone not found" : "Offline · type your request");
      }
      if(V.armed && !V.awake) V.timer = setTimeout(wakeListen, 1500);
    };
    try{ r.start(); }catch(e){ V.timer = setTimeout(wakeListen, 1500); }
  }
  function wakeUp(heard){
    V.awake = true;
    beep(1180, 0.12);
    ui("awake", "Listening…");
    try{ siriOpen(); siriSet("listening", String(heard || "").trim() || "Listening…"); }catch(e){}
    /* the words that woke her are often the whole order: "Aura, play kesariya" */
    var rest = norm(String(heard || ""));
    if(rest.length > 2) return run(rest);
    var r = new SR();
    r.lang = "en-IN"; r.continuous = false; r.interimResults = true; r.maxAlternatives = 1;
    var said = "";
    r.onresult = function(ev){
      var interim = ""; said = "";
      for(var i = ev.resultIndex; i < ev.results.length; i++){
        if(ev.results[i].isFinal) said += ev.results[i][0].transcript;
        else interim += ev.results[i][0].transcript;
      }
      var live = (said + " " + interim).trim();
      if(live){ ui("awake", live.slice(0, 58)); if(P.open) siriSet("listening", live); }
    };
    r.onend = function(){
      var t = (said || "").trim();
      if(t.length > 1) run(t);
      else { V.awake = false; idle(); if(V.armed) V.timer = setTimeout(wakeListen, 500); }
    };
    r.onerror = function(){ V.awake = false; idle(); if(V.armed) V.timer = setTimeout(wakeListen, 800); };
    V.rec = r;
    try{ r.start(); }catch(e){ V.awake = false; idle(); }
  }
  function run(text){
    var done = false;
    if(P.open) siriSet("thinking", text);
    try{ done = window.__siriIntent(text); }catch(e){ done = false; }
    if(!done){
      var inp = document.getElementById("inp"), send = document.getElementById("send");
      if(inp && send){
        V.expect = true;
        inp.value = text;
        inp.dispatchEvent(new Event("input", { bubbles: true }));
        send.click();
      }
    }
    /* a command usually ends here; the chat path returns to the ear when it speaks */
    setTimeout(function(){ V.awake = false; if(V.armed && !speechSynthesis.speaking) V.timer = setTimeout(wakeListen, 700); else idle(); }, 1200);
  }
  /* AURA answers the question out loud */
  (function wrapAdd(){
    if(typeof window.addMsg !== "function" || window.addMsg.__auraVoice) return setTimeout(wrapAdd, 500);
    var orig = window.addMsg;
    window.addMsg = function(role, text, noSave){
      var d = orig.apply(this, arguments);
      try{ if(String(role) === "a" && V.expect){ V.expect = false; say(String(text || "")); } }catch(e){}
      return d;
    };
    window.addMsg.__auraVoice = true;
  })();

  function label(){
    var b = document.querySelector('#tools button[data-x="live"]');
    if(b){ b.textContent = V.armed ? "🎙 Hands-free: on" : "🎙 Hands-free: off"; b.classList.toggle("on", V.armed); }
    var mic = document.getElementById("mic");
    if(mic) mic.classList.toggle("on", V.armed && !V.awake);
  }
  function arm(manual){
    if(V.armed) return;
    if(!SR){ ui("off", "This browser has no voice input"); return; }
    V.armed = true; V.denied = false;
    /* a silent arm (first touch, first sheet) reports problems only in the chip, never
       as a toast — the visitor did not ask for anything yet */
    V.silent = !manual;
    try{ localStorage.setItem("aura_wake", "1"); }catch(e){}
    label(); idle();
    beep(760, 0.1);
    wakeListen();
    if(manual) flash("🎙 Say “Aura”, then your request", 3200);
  }
  function disarm(){
    V.armed = false; V.awake = false; V.silent = false; clearTimeout(V.timer);
    try{ if(V.rec){ V.rec.onend = null; V.rec.abort(); } }catch(e){}
    try{ speechSynthesis.cancel(); }catch(e){}
    try{ localStorage.setItem("aura_wake", "0"); }catch(e){}
    label(); ui(false);
  }
  window.__auraArm = function(){ arm(true); };
  window.__auraDisarm = disarm;
  window.__auraVoiceToggle = function(){ if(V.armed){ disarm(); } else { arm(true); siriOpen(); } };

  /* a visible way in for anyone who does not know the wake word: tools row + keys */
  function siriLauncher(){
    try{
      var tools = document.getElementById("tools");
      if(tools && !document.getElementById("auraSiriBtn")){
        var b = document.createElement("button");
        b.id = "auraSiriBtn"; b.type = "button"; b.textContent = "✨ Siri";
        b.title = "Talk to AURA hands-free";
        b.style.cssText = "display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:9px;" +
          "border:1px solid rgba(120,215,255,.22);background:rgba(120,215,255,.08);color:#dff4ff;" +
          "font:12.5px/1.4 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;cursor:pointer;user-select:none";
        b.onclick = function(e){ e.stopPropagation(); try{ closeMenus(); }catch(err){} siriOpen(); };
        tools.appendChild(b);
      }
    }catch(e){}
  }
  setTimeout(siriLauncher, 1400);
  setTimeout(siriLauncher, 3200);
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && P.open){ siriClose(); return; }
    if((e.ctrlKey || e.metaKey) && e.code === "Space"){ e.preventDefault(); if(P.open) siriListen(); else siriOpen(); }
  }, true);

  /* the menu row is now just the switch for the wake word — nothing to "enter" */
  (function bind(){
    var b = document.querySelector('#tools button[data-x="live"]');
    if(!b) return setTimeout(bind, 400);
    b.onclick = function(ev){ try{ ev.preventDefault(); ev.stopImmediatePropagation(); }catch(e){} window.__auraVoiceToggle(); };
    label();
  })();

  /* Hands-free is on by default, Siri-style, without ever nagging: nothing on first
     paint (no prompt, no chip, no mic error), then the first real touch arms the ear
     silently. Only a machine with no microphone is skipped, and an explicit "off" is
     remembered forever. */
  var armedOnce = false, micChecked = false;
  function hasMic(cb){
    var done = function(ok){ if(micChecked) return; micChecked = true; cb(ok); };
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return done(true);
      var afterPerm = function(state){
        if(state === "denied") return done(false);
        navigator.mediaDevices.enumerateDevices().then(function(list){
          var ins = (list || []).filter(function(d){ return d.kind === "audioinput"; });
          done(ins.length > 0 || state === "granted");
        }).catch(function(){ done(true); });
      };
      var p = null;
      try{ if(navigator.permissions && navigator.permissions.query) p = navigator.permissions.query({ name: "microphone" }); }catch(e){}
      if(p && p.then) p.then(function(s){ afterPerm(s.state); }, function(){ afterPerm("prompt"); });
      else afterPerm("prompt");
    }catch(e){ done(true); }
  }
  function autoArm(){
    if(armedOnce) return;
    var pref = null; try{ pref = localStorage.getItem("aura_wake"); }catch(e){}
    /* "0" means the visitor turned it off on purpose; that choice wins */
    if(pref === "0" || V.armed || V.denied) return;
    armedOnce = true;
    hasMic(function(ok){
      if(!ok) return;
      var now = null; try{ now = localStorage.getItem("aura_wake"); }catch(e){}
      if(now === "0" || V.armed || V.denied) return;
      arm(false);
    });
  }
  ["pointerdown", "touchstart", "keydown"].forEach(function(ev){
    window.addEventListener(ev, autoArm, { once: true, capture: true });
  });
  /* a returning visit is already trusted: try straight away, and fall back to tap */
  setTimeout(function(){
    var pref = null; try{ pref = localStorage.getItem("aura_wake"); }catch(e){}
    /* a returning visit is already trusted: arm even without a fresh tap */
    if(pref === "1" && !V.armed) autoArm();
  }, 2200);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && V.armed && !V.awake && !speechSynthesis.speaking) wakeListen();
  });
  window.addEventListener("online", function(){ if(V.armed && !V.awake) wakeListen(); });
  window.addEventListener("offline", function(){ ui("off", "Offline · local commands still work"); setTimeout(idle, 2500); });
})();
</script>



<script>/* ================= AURA APP SHELL =================
   Makes the web build behave like an installed app:
   1. iOS standalone metas (Apple ignores the manifest display mode)
   2. ?action=vision|voice|code deep links, so a home-screen shortcut or a pin can
      open the app straight into that workflow
   3. a one-tap install pill on phones that do not fire beforeinstallprompt in time
*/

(function(){
  var A = window.AURA_APP_SHELL = { version: 1 };

  /* ---- 1. iOS metas ---- */
  function meta(name, content, prop){
    var sel = prop ? 'meta[property="' + name + '"]' : 'meta[name="' + name + '"]';
    if(document.querySelector(sel)) return;
    var m = document.createElement('meta');
    if(prop) m.setAttribute('property', name); else m.name = name;
    m.content = content;
    document.head.appendChild(m);
  }
  meta('apple-mobile-web-app-capable', 'yes');
  meta('mobile-web-app-capable', 'yes');
  meta('apple-mobile-web-app-status-bar-style', 'black-translucent');
  meta('apple-mobile-web-app-title', 'AURA');
  meta('application-name', 'AURA');
  meta('og:title', 'AURA — an interface, not a chatbot', true);

  /* ---- themed scrollbars ----
     the mesh list, the command palette and the code output all showed a raw white OS
     scrollbar on the dark panels, which looked unfinished */
  try{
    var sb = document.createElement('style'); sb.id = 'auraScrollCss';
    sb.textContent = '*{scrollbar-width:thin;scrollbar-color:rgba(120,215,255,.32) transparent}' +
      '::-webkit-scrollbar{width:8px;height:8px}' +
      '::-webkit-scrollbar-track{background:transparent}' +
      '::-webkit-scrollbar-thumb{background:rgba(120,215,255,.28);border-radius:8px}' +
      '::-webkit-scrollbar-thumb:hover{background:rgba(120,215,255,.45)}' +
      '::-webkit-scrollbar-corner{background:transparent}';
    document.head.appendChild(sb);
  }catch(e){}

  /* ---- 2. deep links ---- */
  var ACTIONS = { vision: 0, voice: 1, code: 2, flows: -1 };
  function wanted(){
    var q = '';
    try{ q = new URL(location.href).searchParams.get('action') || ''; }catch(e){}
    if(!q && location.hash) q = location.hash.replace(/^#\/?/, '');
    return String(q || '').toLowerCase();
  }
  function runAction(name){
    /* the workflow cards are gone, so a shortcut has to land somewhere real */
    if(name === 'voice' || name === 'flows'){
      try{
        window.__auraSiri.show();
        window.__auraArm();
        return true;
      }catch(e){ return false; }
    }
    if(name === 'vision'){
      var camBtn = document.querySelector('#tools button[data-x="cam"]');
      if(!camBtn) return false;
      try{ camBtn.click(); return true; }catch(e){ return false; }
    }
    if(name === 'code'){
      /* phones do not carry the Code workspace; the shortcut must not force a hidden panel */
      try{ if(matchMedia('(max-width: 820px)').matches) return false; }catch(e){}
      var tab = document.querySelector('#tabs button[data-p="code"]');
      if(!tab) return false;
      try{ tab.click(); return true; }catch(e){ return false; }
    }
    return false;
  }
  function boot(){
    var want = wanted();
    if(!want) return;
    var tries = 0;
    (function wait(){
      if(runAction(want)) { try{ history.replaceState(null, '', location.pathname); }catch(e){} return; }
      if(tries++ < 24) setTimeout(wait, 250);
    })();
  }

  /* ---- 3. install pill (small, dismissible, mobile only) ---- */
  function pill(){
    if(document.getElementById('auraInstallPill')) return;
    var standalone = false;
    try{ standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }catch(e){}
    if(standalone) return;
    /* the pill is a phone affordance; on a laptop it only covered the tips line */
    try{ if(matchMedia('(min-width: 821px)').matches) return; }catch(e){}
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
    var b = document.createElement('button');
    b.id = 'auraInstallPill'; b.type = 'button';
    b.textContent = ios ? '\u2b06 Add to Home Screen' : '\u2b07 Install AURA';
    b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:96;' +
      'padding:9px 15px;border-radius:999px;border:1px solid rgba(120,215,255,.42);background:rgba(10,18,28,.94);' +
      'color:#dff4ff;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(10px);' +
      'box-shadow:0 10px 26px rgba(0,0,0,.5)';
    b.onclick = function(){
      b.remove();
      if(ios){
        try{ window.addMsg && window.addMsg('a', 'Install on iPhone: **Share \u2192 Add to Home Screen** — it then opens fullscreen like an app.'); }catch(e){}
        return;
      }
      var btn = document.getElementById('auraInstallBtn');
      if(btn) btn.click();
      else {
        try{ window.addMsg && window.addMsg('a', 'Install: browser menu (**\u22ee**) \u2192 **Install app / Add to home screen**. AURA then opens in its own window, no address bar.'); }catch(e){}
      }
    };
    document.body.appendChild(b);
    setTimeout(function(){ try{ b.style.opacity = '0'; b.style.transition = 'opacity .4s'; setTimeout(function(){ b.remove(); }, 500); }catch(e){} }, 26000);
  }

  boot();
  if(innerWidth < 900) setTimeout(pill, 3200);
  A.runAction = runAction;
})();
</script>
<script>/* ================= AURA MOBILE FIX =================
   The reference layout hides the Code tab below 780px and leaves the welcome copy
   visible behind the Code panel, so on a phone the workspace looked broken: ghost
   text under the header, a 267px editor with nested scrollbars, and the install pill
   sitting on top of the output. All three are corrected here without touching the
   reference file.
*/

(function(){
  var css = [
    /* the Code tab must be reachable on a phone — it was display:none */
    "/* the reference hides the workspace tab at every width — it is a real panel */",
    "#tabs button[data-p=\"code\"]{display:block !important}",
    "@media (max-width:820px){",
    /* the Code workspace is a laptop surface: it is not offered on phones at all */
    "#tabs button[data-p=\"code\"]{display:none !important}",
    "#p-code{display:none !important}",
    /* "Code" is the first suggestion chip in the base row; hiding it by position as well
       means a re-render of that row cannot bring it back on a phone */
    "#qp>button:first-child{display:none !important}",
    "#tabs{gap:2px}",
    /* a panel other than Chat must never show the welcome copy behind it */
    "body[data-aura-tab]:not([data-aura-tab=\"chat\"]) #wel{display:none !important}",
    /* the workspace gets real room instead of a 143px slit */
    "#p-code{padding-bottom:calc(84px + env(safe-area-inset-bottom))}",
    "#p-code h1,#p-code .h1{font-size:clamp(22px,7vw,30px) !important;margin-bottom:8px}",
    /* the reference wraps the editor in .gt with a fixed height, which clipped it to 95px */
    "#p-code .gt{height:auto !important;min-height:36vh;max-height:46vh;overflow:visible !important}",
    "#p-code .gt > *{max-height:none !important}",
    /* .ed clipped the editor and .forge scrolled inside the page, so the workspace
       looked like a slit with two scrollbars — stack the whole panel in one flow */
    /* flex column with a fixed .pn height shrank .ed until it clipped the editor */
    "#p-code .forge{overflow:visible !important;height:auto !important;display:block !important}",
    "#p-code .ed,#p-code .out{flex:0 0 auto}",
    "#p-code .out{margin-top:12px}",
    "#p-code .ed{height:auto !important;overflow:visible !important}",
    "#p-code .ed>.bar{flex-wrap:wrap;gap:6px;padding-top:0}",
    "#p-code .ed>.bar button,#p-code .ed>.bar .b{flex:1 1 auto;min-width:88px;text-align:center;padding:9px 6px}",
    "#p-code .gt{max-height:none !important}",
    "#p-code .out{height:auto !important;max-height:none;overflow:visible !important}",
    "#p-code .out>.bar{position:sticky;top:0;z-index:2}",
    "#p-code #frm{background:#0b1119;border-radius:10px}",
    "#code{height:34vh !important;min-height:150px !important;max-height:38vh !important;font-size:12.5px !important;",
    "  line-height:1.55 !important;white-space:pre-wrap !important;overflow-wrap:anywhere;tab-size:2}",
    "#p-code .out{min-height:120px;max-height:30vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}",
    "#p-code select,#p-code button{font-size:12.5px}",
    /* floating chrome must not cover the editor or the output */
    "#wel{padding-bottom:190px !important}",
    /* the install pill sat on the composer — pin it under the tab bar instead */
    "#auraInstallPill{top:calc(122px + env(safe-area-inset-top)) !important;bottom:auto !important;left:auto !important;right:14px !important;transform:none !important;padding:7px 12px !important;font-size:12px !important}",
    "body[data-aura-tab]:not([data-aura-tab=\"chat\"]) #auraInstallPill{display:none !important}",
    /* the System tab draws a fixed 900px waveform canvas, so that one panel scrolled
       sideways on a phone while every other tab fit */
    "#bigspk{width:100% !important;max-width:100% !important;height:auto !important;display:block}",
    /* the stat grid's items kept an auto minimum, so "DISPLAY 390×844" pushed the second
       column past the panel and the whole System tab scrolled sideways */
    "#big4{grid-template-columns:1fr 1fr !important;gap:8px !important}",
    "#big4 .bk{min-width:0 !important;width:auto !important;padding:10px 12px !important}",
    "#big4 .bk b,#big4 .bk span{min-width:0 !important;overflow-wrap:anywhere}",
    "}",
    /* tablet / laptop: keep the editor honest but let it grow */
    "@media (min-width:821px){#code{min-height:220px}}",
    /* the pill is phone chrome; a window resized to desktop must not keep it over the tips */
    "@media (min-width:821px){#auraInstallPill{display:none !important}}"
  ].join("\n");

  var st = document.createElement("style");
  st.id = "auraMobileFix";
  st.textContent = css;
  document.head.appendChild(st);

  /* the "Code" suggestion chip is the same laptop surface: with the Code workspace gone
     on phones, a chip that only writes code should not stay behind on its own */
  try{
    var hideCodeChip = function(){
      var mobile = matchMedia('(max-width: 820px)').matches;
      [].forEach.call(document.querySelectorAll('#qp button'), function(b){
        if((b.textContent || '').trim() !== 'Code') return;
        b.style.display = mobile ? 'none' : '';
      });
    };
    hideCodeChip();
    addEventListener("resize", hideCodeChip);
    document.addEventListener("visibilitychange", hideCodeChip);
    setTimeout(hideCodeChip, 1200);
    /* if the window is narrowed while Code is open (or a deep link lands before the
       media query applies) the tab and its panel are both hidden: fall back to Chat
       instead of leaving an empty stage */
    var leaveCode = function(){
      if(!matchMedia("(max-width: 820px)").matches) return;
      var on = document.querySelector('#tabs button[data-p="code"].on');
      if(!on) return;
      var chat = document.querySelector('#tabs button[data-p="chat"]');
      if(chat) chat.click();
    };
    leaveCode();
    addEventListener("resize", leaveCode);
    setTimeout(leaveCode, 1500);
    /* a resize event is not guaranteed when the breakpoint is crossed, the media query
       listener is */
    try{
      var mq = matchMedia("(max-width: 820px)");
      var onBreak = function(){ hideCodeChip(); leaveCode(); };
      if(mq.addEventListener) mq.addEventListener("change", onBreak);
      else if(mq.addListener) mq.addListener(onBreak);
    }catch(e){}
    /* the suggestion row is painted and re-painted by the base UI, which used to bring
       the Code chip back after the first pass — watch it instead of guessing a delay */
    try{
      var qp = document.getElementById("qp");
      if(qp && window.MutationObserver){
        new MutationObserver(hideCodeChip).observe(qp, { childList: true, subtree: true });
      }
    }catch(e){}
  }catch(e){}

  /* keep body[data-aura-tab] in sync with the reference's own tab state */
  function paint(){
    var active = document.querySelector("#tabs button.on");
    var p = (active && active.dataset.p) || "chat";
    if(document.body.dataset.auraTab !== p) document.body.dataset.auraTab = p;
  }
  var goTab = window.goTab;
  if(typeof goTab === "function" && !goTab.__auraWrapped){
    window.goTab = function(p){
      var out = goTab.apply(this, arguments);
      paint();
      return out;
    };
    window.goTab.__auraWrapped = true;
  }
  document.addEventListener("click", function(e){
    var t = e.target && e.target.closest ? e.target.closest("#tabs button") : null;
    if(t) setTimeout(paint, 30);
  }, true);
  paint();
  setTimeout(paint, 400);
  setTimeout(paint, 1500);
})();
</script>
