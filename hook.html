<script id="aura-engine-hook">
/* The interface is the reference file, untouched. This block is the only addition:
   1. plugs AURA's real backend into the reference's own hook (window.AURA_HOOKS.send)
   2. adds Mesh + Attach to its + menu, using the reference's own markup and classes   */
(function(){
  var BASE = (localStorage.getItem("aura_backend_url") || "https://aura-backend-jomj.onrender.com").replace(/\/+$/, "");

  /* The reference reveals every answer one character at a time (~35 ms each), so an
     ordinary paragraph still took eight seconds to appear after the engine had already
     answered. By the time the hook returns, the text is whole — show it whole. The
     async shape is kept because the caller awaits it. */
  try{
    window.typeInto = async function(el, text){
      if(!el) return;
      el.textContent = String(text == null ? "" : text);
    };
  }catch(e){}
  var $ = function(s){ return document.querySelector(s); };

  /* ---------------- BOOT RESCUE ----------------
     The reference hides the whole app with .hold{visibility:hidden} until its own
     boot finishes. One thrown error before that line leaves a black page where only
     an overlay (Docs, Mesh, a menu) is visible — exactly the "kuch nahi dikh raha"
     report. The intro is gone, so the app never needs to stay hidden: drop .hold now,
     again over the next seconds, and on any uncaught error. */
  (function rescueApp(){
    var app = document.getElementById('app');
    function show(){
      try{
        if(!app) app = document.getElementById('app');
        if(!app) return;
        app.classList.remove('hold');
        if(getComputedStyle(app).visibility === 'hidden') app.style.visibility = 'visible';
        document.body.classList.remove('leaving');
      }catch(e){}
    }
    show();
    setTimeout(show, 250);
    setTimeout(show, 900);
    setTimeout(show, 2200);
    window.addEventListener('error', show);
    window.addEventListener('unhandledrejection', show);
    /* anything that re-adds .hold later is dropped immediately */
    try{
      if(window.MutationObserver && app){
        new MutationObserver(function(muts){ if(app.classList.contains('hold')) show(); })
          .observe(app, { attributes: true, attributeFilter: ['class'] });
      }
    }catch(e){}
  })();

  function owner(){
    try{
      var v = localStorage.getItem("aura_owner_v1");
      if(!v || !/^[A-Za-z0-9_-]{8,64}$/.test(v)){
        v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().replace(/-/g, "")
                                                  : ("g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
        localStorage.setItem("aura_owner_v1", v);
      }
      return v;
    }catch(e){ return ""; }
  }
  var nodeId = (function(){
    try{
      var v = localStorage.getItem("aura_mesh_node");
      if(!v){ v = "n" + Math.random().toString(36).slice(2, 10); localStorage.setItem("aura_mesh_node", v); }
      return v;
    }catch(e){ return "n" + Math.random().toString(36).slice(2, 10); }
  })();
  /* one hard mute for everything AURA can make a sound with */
  function auraMuted(){ try{ return localStorage.getItem("aura_sound_off") === "1"; }catch(e){ return false; } }
  function auraSetMuted(on){
    try{ localStorage.setItem("aura_sound_off", on ? "1" : "0"); }catch(e){}
    if(on){
      try{ speechSynthesis.cancel(); }catch(e){}
      try{ [].forEach.call(document.querySelectorAll("audio,video"), function(m){ try{ m.muted = true; }catch(e){} }); }catch(e){}
    }
  }
  function devName(){
    /* every paired phone was called "Device", so the list was a column of clones.
       A browser + platform name makes it obvious which one is which. */
    try{ var n = localStorage.getItem("az.name"); if(n){ n = JSON.parse(n); if(n) return n; } }catch(e){}
    try{
      var ua = navigator.userAgent || "";
      var br = /Edg\//.test(ua) ? "Edge" : /OPR\//.test(ua) ? "Opera" : /Chrome\//.test(ua) ? "Chrome"
             : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Browser";
      var os = /Android/.test(ua) ? "Android" : /iPhone|iPad|iPod/.test(ua) ? "iPhone"
             : /Windows/.test(ua) ? "Windows" : /Mac OS X/.test(ua) ? "Mac" : /Linux/.test(ua) ? "Linux" : "";
      return os ? (br + " \u00b7 " + os) : br;
    }catch(e){ return "Device"; }
  }
  function api(path, body, method){
    var h = { "Content-Type": "application/json" };
    var o = owner(); if(o) h["X-Aura-Owner"] = o;
    var opt = { method: method || (body ? "POST" : "GET"), headers: h };
    if(body) opt.body = JSON.stringify(body);
    /* a stalled request must never hang the mesh forever */
    try{ opt.signal = AbortSignal.timeout(15000); }catch(e){}
    return fetch(BASE + path, opt).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok) throw new Error(j.error || ("HTTP " + r.status));
        return j;
      });
    });
  }

  /* ---------------- attachments ---------------- */
  var files = [];
  var input = document.createElement("input");
  input.type = "file"; input.multiple = true;
  /* display:none kept the picker from opening on iOS Safari; an off-screen 1px input
     that is still rendered opens everywhere */
  input.style.cssText = "position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none";
  input.setAttribute("aria-hidden", "true");
  input.id = "auraFilePicker";   /* the Attach control is a <label for> this id */
  /* .docx and .pdf were missing here, so Android's picker hid them and a Word or PDF
     file could not be chosen at all — the "attachment doesn't work" report. */
  input.accept = "image/*,.pdf,.docx,.docm,.txt,.md,.json,.csv,.js,.ts,.html,.css,.py,.java,.c,.cpp,.log,.xml,.yml,.yaml";
  document.body.appendChild(input);

  var card = $("#card"), inp = $("#inp");
  var strip = document.createElement("div");
  strip.id = "auraFiles";
  strip.style.cssText = "display:none;gap:8px;flex-wrap:wrap;margin:2px 0 10px";
  if(card && inp) card.insertBefore(strip, inp);

  function kb(n){
    if(!n) return "";
    return n < 1024 ? n + " B" : (n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB");
  }
  function ext(name){
    var m = String(name || "").match(/\.([A-Za-z0-9]{1,4})$/);
    return m ? m[1].toUpperCase() : "FILE";
  }
  /* a real preview card, not a text chip: you should recognise the picture you are
     about to send before it leaves the composer */
  function renderFiles(){
    if(!strip) return;
    strip.innerHTML = "";
    strip.style.display = files.length ? "flex" : "none";
    strip.style.cssText = "display:" + (files.length ? "flex" : "none") +
      ";gap:8px;flex-wrap:wrap;margin:2px 0 10px";
    files.forEach(function(f, i){
      var card = document.createElement("div");
      card.style.cssText = "position:relative;display:flex;align-items:center;gap:9px;padding:7px 30px 7px 7px;" +
        "border-radius:12px;border:1px solid rgba(120,215,255,.22);background:rgba(8,14,24,.72);" +
        "backdrop-filter:blur(10px);max-width:216px;min-width:0";
      var art;
      if(f.image){
        art = '<img alt="" src="' + String(f.data).replace(/"/g, "&quot;") + '" ' +
          'style="width:48px;height:48px;border-radius:9px;object-fit:cover;flex:none;border:1px solid rgba(255,255,255,.12)">';
      } else {
        art = '<span style="width:48px;height:48px;border-radius:9px;flex:none;display:flex;align-items:center;' +
          'justify-content:center;font:700 11px/1 ui-monospace,monospace;letter-spacing:.5px;' +
          'color:#a9e3ff;background:linear-gradient(160deg,rgba(0,162,255,.22),rgba(120,80,255,.16));' +
          'border:1px solid rgba(120,215,255,.2)">' + ext(f.name) + '</span>';
      }
      var meta = f.image ? ("Image \u00b7 " + (kb(f.bytes) || "ready")) : (ext(f.name) + " \u00b7 " + (kb(f.bytes) || "text"));
      var label = '<span style="min-width:0;display:block">' +
        '<span style="display:block;font-size:12.5px;color:#e6f4ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:132px">' +
        String(f.name).replace(/[<>&]/g, "") + '</span>' +
        '<span style="display:block;margin-top:2px;font-size:11px;color:rgba(190,215,235,.6)">' + meta + '</span></span>';
      card.innerHTML = art + label;
      var x = document.createElement("button");
      x.type = "button";
      x.setAttribute("aria-label", "Remove " + String(f.name));
      x.textContent = "\u2715";
      x.style.cssText = "position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;" +
        "background:rgba(0,0,0,.5);color:#cfe9ff;font-size:11px;line-height:1;cursor:pointer;display:flex;" +
        "align-items:center;justify-content:center";
      x.onclick = function(e){ e.stopPropagation(); files.splice(i, 1); renderFiles(); };
      card.appendChild(x);
      strip.appendChild(card);
    });
  }
  function readOne(file){
    return new Promise(function(done){
      if(/^image\//.test(file.type)){
        var fr = new FileReader();
        fr.onload = function(){
          var src = String(fr.result || "");
          /* a phone photo is 3-8 MB. Shrinking it to 1280 px JPEG before upload makes
             the request small enough to actually go through on mobile data, and the
             vision model reads it just as well. */
          var img = new Image();
          img.onload = function(){
            try{
              var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
              var k = Math.min(1, 1280 / Math.max(w, h));
              if(k >= 0.999 && src.length < 900000){ done({ name: file.name, image: true, bytes: file.size, data: src }); return; }
              var cv = document.createElement("canvas");
              cv.width = Math.max(1, Math.round(w * k));
              cv.height = Math.max(1, Math.round(h * k));
              var ctx = cv.getContext("2d");
              ctx.fillStyle = "#fff";
              ctx.fillRect(0, 0, cv.width, cv.height);
              ctx.drawImage(img, 0, 0, cv.width, cv.height);
              var out = cv.toDataURL("image/jpeg", 0.82);
              done({ name: file.name, image: true, bytes: file.size, data: (out && out.length < src.length) ? out : src });
            }catch(e){ done({ name: file.name, image: true, bytes: file.size, data: src }); }
          };
          img.onerror = function(){ done({ name: file.name, image: true, bytes: file.size, data: src }); };
          img.src = src;
        };
        fr.onerror = function(){ done(null); };
        fr.readAsDataURL(file);
        return;
      }
      /* A .pdf is a container of compressed streams. Inflate each stream in the page and
         pull the text-showing operators (Tj / TJ / ') out of them — good enough for the
         invoices, notes and reports people actually attach, with no library. */
      if(/\.pdf$/i.test(file.name || "") || /application\/pdf/.test(file.type || "")){
        pdfText(file).then(function(t){
          var body = (t || "").trim();
          if(body.length > 1){
            done({ name: file.name, bytes: file.size, text: body.length > 20000 ? body.slice(0, 20000) + "\n…(truncated)" : body });
          } else {
            done({ name: file.name, bytes: file.size, text: "[This PDF has no selectable text — it is probably a scan or photos. Send a screenshot of the page instead and I can read that.]" });
          }
        }).catch(function(){
          done({ name: file.name, bytes: file.size, text: "[Could not read the text inside this PDF here. Send a screenshot of the page instead.]" });
        });
        return;
      }
      /* A .docx is a ZIP, not text. readAsText on one sends binary rubbish to the
         model, which then "thinks" forever about nothing — that is the stuck screenshot.
         Pull word/document.xml out of the zip and inflate it in the page. */
      if(/\.(docx|docm)$/i.test(file.name || "") || /officedocument\.wordprocessingml/.test(file.type || "")){
        docxText(file).then(function(t){
          if(t && t.trim().length > 1) done({ name: file.name, bytes: file.size, text: t.length > 20000 ? t.slice(0, 20000) + "\n…(truncated)" : t });
          else done({ name: file.name, bytes: file.size, text: "[This .docx opened but no readable text was found in it.]" });
        }).catch(function(){
          done({ name: file.name, bytes: file.size, text: "[Could not read inside this .docx here. Ask for the text, or paste it.]" });
        });
        return;
      }
      var fr = new FileReader();
      fr.onload = function(){
        var t = String(fr.result || "");
        done({ name: file.name, bytes: file.size, text: t.length > 20000 ? t.slice(0, 20000) + "\n…(truncated)" : t });
      };
      fr.onerror = function(){ done(null); };
      fr.readAsText(file);
    });
  }

  /* minimal ZIP reader: only enough to find one entry and inflate it */
  /* PDF text, no library: every "stream … endstream" block is inflated (FlateDecode) and
     the strings inside the text operators (Tj, TJ, ') are collected in order. Words that
     sit apart on one line are joined with a space, lines are separated by a newline. */
  async function pdfText(file){
    var buf = new Uint8Array(await file.arrayBuffer());
    var latin = "";
    for(var i = 0; i < buf.length; i += 8192){
      latin += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));
    }
    function inflate(bytes){
      if(typeof DecompressionStream !== "function") return Promise.resolve(null);
      /* Blob().stream().pipeThrough is the shape every browser supports; writing into the
         writable by hand sometimes closes it before the bytes are flushed */
      function run(fmt){
        try{
          var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(fmt));
          return new Response(stream).arrayBuffer().then(function(b){ return b.byteLength ? new Uint8Array(b) : null; }).catch(function(){ return null; });
        }catch(e){ return Promise.resolve(null); }
      }
      /* PDF FlateDecode is zlib-wrapped, but some writers skip the header */
      return run("deflate").then(function(b){ return b || run("deflate-raw"); });
    }
    function unescapePdf(s){
      return s.replace(/\\([nrtbf()\\])/g, function(m, c){
        return c === "n" ? "\n" : c === "r" ? "" : c === "t" ? "\t" : c === "b" || c === "f" ? "" : c;
      }).replace(/\\([0-7]{1,3})/g, function(m, o){ return String.fromCharCode(parseInt(o, 8)); });
    }
    /* text out of a decoded content stream */
    function harvest(txt){
      var out = [], m;
      var re = /\(((?:\\.|[^\\()])*)\)\s*(Tj|TJ|')|\[((?:[^\[\]]|\\.)*)\]\s*TJ|(T\*|TD|Td|ET)/g;
      while((m = re.exec(txt))){
        if(m[1] != null){ out.push(unescapePdf(m[1]) + (m[2] === "'" ? "\n" : "")); }
        else if(m[3] != null){
          var arr = [], r2 = /\(((?:\\.|[^\\()])*)\)|(-?[\d.]+)/g, a;
          while((a = r2.exec(m[3]))){ arr.push(a[1] != null ? unescapePdf(a[1]) : (parseFloat(a[2]) < -120 ? " " : "")); }
          out.push(arr.join(""));
        }
        else if(m[4]){ out.push("\n"); }
      }
      return out.join("");
    }
    var pieces = [];
    var at = 0, guard = 0;
    while(guard++ < 400){
      var s = latin.indexOf("stream", at);
      if(s < 0) break;
      var start = s + 6;
      if(latin.charAt(start) === "\r") start++;
      if(latin.charAt(start) === "\n") start++;
      var e = latin.indexOf("endstream", start);
      if(e < 0) break;
      at = e + 9;
      var head = latin.slice(parentHead(latin, s), s);
      /* honour /Length when it is there — the newline before `endstream` is not part of
         the deflate data and Chrome's DecompressionStream rejects it */
      var lenM = head.match(/\/Length\s+(\d+)/);
      var stop = e;
      if(lenM){
        var want = start + parseInt(lenM[1], 10);
        if(want > start && want <= e) stop = want;
      }
      if(stop === e){
        while(stop > start && (buf[stop - 1] === 10 || buf[stop - 1] === 13 || buf[stop - 1] === 32)) stop--;
      }
      var raw = buf.subarray(start, stop);
      pieces.push(raw);
      /* uncompressed streams are readable as they are */
      if(/\/FlateDecode/.test(head)) continue;
      pieces.pop();
      var body = latin.slice(start, e);
      if(/\((?:\\.|[^\\()])*\)\s*(Tj|TJ)/.test(body)) pieces.push(body);
    }
    function parentHead(all, idx){ /* the dict right before `stream` */
      var from = Math.max(0, idx - 700);
      var k = all.lastIndexOf("obj", idx);
      return Math.max(from, k < 0 ? from : k);
    }
    var texts = [];
    for(var p = 0; p < pieces.length; p++){
      var piece = pieces[p];
      if(typeof piece === "string"){ texts.push(harvest(piece)); continue; }
      var inf = await inflate(piece);
      if(inf && inf.length){
        var str = "";
        for(var q = 0; q < inf.length; q += 8192) str += String.fromCharCode.apply(null, inf.subarray(q, q + 8192));
        texts.push(harvest(str));
      }
    }
    var text = texts.join("\n").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").replace(/[^\x09\x0a\x20-\x7e\u00a0-\uffff]/g, "");
    return text.trim();
  }

  async function docxText(file){
    var buf = new Uint8Array(await file.arrayBuffer());
    function u16(o){ return buf[o] | (buf[o + 1] << 8); }
    function u32(o){ return (buf[o] | (buf[o + 1] << 8) | (buf[o + 2] << 16) | (buf[o + 3] << 24)) >>> 0; }
    function nameAt(o, n){ var s = ""; for(var k = 0; k < n; k++) s += String.fromCharCode(buf[o + k]); return s; }
    var entry = null;
    /* central directory is the reliable one (local headers may use data descriptors) */
    for(var e = buf.length - 22; e >= 0 && e > buf.length - 66000; e--){
      if(u32(e) !== 0x06054b50) continue;
      var n = u16(e + 10), off = u32(e + 16);
      for(var k = 0; k < n; k++){
        if(u32(off) !== 0x02014b50) break;
        var nl = u16(off + 28), el = u16(off + 30), cl = u16(off + 32);
        if(nameAt(off + 46, nl) === "word/document.xml"){
          /* central header: name len at +28, extra len at +30 (not +26/+28 — that
             shifted the slice and inflated garbage, so the stream errored) */
          entry = { method: u16(off + 10), csize: u32(off + 20), lo: u32(off + 42), nl: u16(off + 28), el: u16(off + 30) };
          break;
        }
        off += 46 + nl + el + cl;
      }
      break;
    }
    if(!entry){
      /* last resort: walk local headers */
      for(var i = 0; i + 30 < buf.length; i++){
        if(u32(i) === 0x04034b50 && nameAt(i + 30, 17) === "word/document.xml"){
          entry = { method: u16(i + 8), csize: u32(i + 18), lo: i, nl: u16(i + 26), el: u16(i + 28) };
          break;
        }
      }
    }
    if(!entry) throw new Error("document.xml not found");
    var start = entry.lo + 30 + entry.nl + entry.el;
    var raw = buf.subarray(start, entry.csize ? start + entry.csize : buf.length);
    var bytes = raw;
    if(entry.method === 8){
      if(!window.DecompressionStream) throw new Error("no inflate here");
      var stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      bytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }else if(entry.method !== 0){
      throw new Error("unsupported compression " + entry.method);
    }
    var xml = new TextDecoder().decode(bytes);
    return xml
      .replace(/<w:tab\/>/g, "\t")
      .replace(/<w:br\/>/g, "\n")
      .replace(/<\/w:p>/g, "\n")
      .replace(/<[^>]+>/g, "")
      .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
  }
  try{ window.__auraDocx = docxText; }catch(e){}
  /* one intake for picker, drag & drop and paste */
  function takeFiles(list){
    list = [].slice.call(list || []);
    if(!list.length) return;
    var big = list.filter(function(f){ return f.size > 12 * 1024 * 1024; });
    if(big.length) tell(big.length + " file(s) skipped — larger than 12 MB");
    var ok = list.filter(function(f){ return f.size <= 12 * 1024 * 1024; });
    if(!ok.length) return;
    Promise.all(ok.map(readOne)).then(function(out){
      var added = 0;
      out.filter(Boolean).forEach(function(f){ if(files.length < 6){ files.push(f); added++; } });
      if(!added) tell("Only 6 files can be attached — remove one first");
      else tell(added + " file attached \u2014 ab sawaal poocho");
      renderFiles();
    });
  }
  input.onchange = function(){
    var list = [].slice.call(input.files || []);
    input.value = "";            /* so the same file can be picked again */
    takeFiles(list);
  };
  /* desktop: drop a file on the composer, or paste a screenshot */
  try{
    if(card){
      ["dragenter", "dragover"].forEach(function(ev){
        card.addEventListener(ev, function(e){
          e.preventDefault();
          card.style.outline = "1px dashed rgba(120,215,255,.55)";
        });
      });
      card.addEventListener("dragleave", function(){ card.style.outline = ""; });
      card.addEventListener("drop", function(e){
        e.preventDefault();
        card.style.outline = "";
        if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) takeFiles(e.dataTransfer.files);
      });
    }
    document.addEventListener("paste", function(e){
      var cd = e.clipboardData;
      if(!cd || !cd.items) return;
      var picked = [];
      for(var i = 0; i < cd.items.length; i++){
        var it = cd.items[i];
        if(it.kind === "file"){ var f = it.getAsFile(); if(f) picked.push(f); }
      }
      if(picked.length) takeFiles(picked);
    });
  }catch(e){}
  /* the send path asks for whatever is staged, then clears it */
  window.__auraAttachPack = function(){
    if(!files.length) return null;
    var text = files.filter(function(f){ return f.text != null })
                    .map(function(f){ return "--- file: " + f.name + " ---\n" + f.text; }).join("\n\n");
    var images = files.filter(function(f){ return f.image }).map(function(f){ return f.data; });
    return { text: text, images: images, count: files.length };
  };
  window.__auraAttachClear = function(){ files.length = 0; renderFiles(); };

  /* ---------------- engine hook ---------------- */
  var history = [];

  /* ---------- reopening a saved chat must restore context, not just bubbles ----------
     The transcript came back on screen but this array (the thing the model actually
     reads) still held the previous conversation, so "Question 2 ka code bhi do" was
     answered with "you never shared Question 2". Anytime a saved chat is opened or a
     new one starts, the array is rebuilt from what is on screen. */
  function attHash(t){
    var s = String(t || '').toLowerCase().slice(0, 120), h = 5381;
    for(var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }
  function syncHistoryFromChat(){
    try{
      var out = [];
      [].forEach.call(document.querySelectorAll('#msgs .m'), function(m){
        var span = m.querySelector(':scope > span') || m.children[m.children.length - 1];
        var txt = span ? String(span.innerText || span.textContent || '').trim() : '';
        /* the Copy/Speak toolbar is not part of the answer */

        '<b id="amvTitle" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b>' +
        '<button id="amvTab" style="padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#cfe9ff;font:600 12px Inter,system-ui,sans-serif;cursor:pointer">\u2197 Tab</button>' +
        '<button id="amvClose" style="padding:6px 10px;border-radius:8px;border:0;background:linear-gradient(135deg,#48c8ff,#2f7bff);color:#04121f;font:700 12px Inter,system-ui,sans-serif;cursor:pointer">Close</button></div>' +
        '<div style="flex:1;position:relative;min-height:0;display:flex">' +
          '<iframe id="amvFrame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" style="flex:1;width:100%;border:0;background:#000"></iframe>' +
          '<div id="amvFallback" style="display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:#04080e;color:#dff3ff;font:13px/1.5 Inter,system-ui,sans-serif">' +
            '<div style="font-size:15px;font-weight:700">This site does not open in here</div>' +
            '<div id="amvFallbackUrl" style="color:#8ea1b2;font-size:11.5px;word-break:break-all;max-width:92%"></div>' +
            '<a id="amvFallbackLink" href="#" style="margin-top:6px;padding:11px 18px;border-radius:12px;background:linear-gradient(135deg,#48c8ff,#2f7bff);color:#04121f;font:700 13px Inter,system-ui,sans-serif;text-decoration:none">\u2197 Open in tab</a>' +
            '<div style="color:#6f8496;font-size:11px">AURA stays open — nothing to set up when you come back</div>' +

      document.body.appendChild(v);

    }
    v.querySelector("#amvTitle").textContent = title || url;
    v.style.display = "flex";
    var fb = v.querySelector("#amvFallback"); if(fb) fb.style.display = "none";

      fr.onload = function(){ loaded = true; };

  /* ---------------- contacts (what "call <name>" needs) ----------------
     A web page cannot read the phone's address book by itself. The Web Contact Picker is
     the one legitimate door: the device owner taps 📇 and picks contacts once. The map of
     name→number stays on THAT device; the host only ever sends a name over the mesh, so a
     number never travels anywhere. Manual add is the fallback for every other browser. */
  function contactsGet(){
    try{ var a = JSON.parse(localStorage.getItem("aura_contacts_v1") || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
  }
  function contactsSet(list){
    try{ localStorage.setItem("aura_contacts_v1", JSON.stringify((list || []).slice(0, 500))); }catch(e){}
    contactsPaint();
  }
  function contactsFind(name){
    var q = String(name || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
    if(!q) return null;
    var all = contactsGet();
    if(!all.length) return null;
    var norm = function(c){ return String(c.n || "").toLowerCase().replace(/\s+/g, " ").trim(); };
    var exact = all.filter(function(c){ return norm(c) === q; });
    if(exact.length) return exact[0];
    var starts = all.filter(function(c){ return norm(c).indexOf(q) === 0; });
    if(starts.length) return starts[0];
    var words = q.split(" ").filter(Boolean);
    var every = all.filter(function(c){
      var nm = norm(c);
      return words.every(function(w){ return nm.indexOf(w) >= 0; });
    });
    if(every.length) return every[0];
    var some = all.filter(function(c){ return norm(c).indexOf(q) >= 0; });
    return some[0] || null;
  }
  function contactsNear(name, max){
    var q = String(name || "").toLowerCase().slice(0, 3);
    return contactsGet().filter(function(c){ return String(c.n || "").toLowerCase().indexOf(q) >= 0; })
      .slice(0, max || 3).map(function(c){ return c.n; });
  }
  /* Mobile browsers open the dialer only from a real tap, so the dial is tried at once and
     a proper call card appears if the page is still here — that one tap is the only thing
     a browser cannot do by itself, and it looks like a phone call, not a permission. */
  function auraCall(number, name){
    var num = String(number || "").replace(/[^+\d]/g, "");
    if(!num) return false;
    try{ tell("\uD83D\uDCDE Calling " + (name || num) + " \u2026"); }catch(e){}
    try{ location.href = "tel:" + num; }catch(e){}
    setTimeout(function(){
      /* the dialer took over — nothing else to do. If AURA was in the background when the
         order came, the card waits and shows the moment the owner is back on this page. */
      var waitForView = document.visibilityState !== "visible";
      if(waitForView && !auraCall.wired){
        auraCall.wired = true;
        document.addEventListener("visibilitychange", function(){
          var el = document.getElementById("auraCallSheet");
          if(el && el.getAttribute("data-pending") === "1" && document.visibilityState === "visible"){
            el.setAttribute("data-pending", "0"); el.style.display = "flex";
          }
        });
      }
      var c = document.getElementById("auraCallSheet");
      if(!c){
        c = document.createElement("div"); c.id = "auraCallSheet";
        c.style.cssText = "position:fixed;inset:0;z-index:99;display:flex;align-items:flex-end;justify-content:center;padding:18px;background:rgba(2,6,12,.72);font:14px Inter,system-ui,sans-serif";
        c.innerHTML = '<div style="width:100%;max-width:420px;background:#0a1520;border:1px solid rgba(120,215,255,.28);border-radius:20px;padding:18px;text-align:center;color:#e9f5ff">' +
          '<div id="acsName" style="font:700 17px Inter,system-ui,sans-serif;margin-bottom:4px"></div>' +
          '<div id="acsNum" style="color:#8ea1b2;font-size:13px;margin-bottom:14px"></div>' +
          '<a id="acsCall" href="#" style="display:block;padding:14px;border-radius:14px;background:linear-gradient(135deg,#48c8ff,#2f7bff);color:#04121f;font:700 15px Inter,system-ui,sans-serif;text-decoration:none">\uD83D\uDCDE Call now</a>' +
          '<button id="acsClose" style="margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#cfe9ff;font:600 12.5px Inter,system-ui,sans-serif">Close</button></div>';
        document.body.appendChild(c);
        c.querySelector("#acsClose").onclick = function(){ c.style.display = "none"; };
      }
      c.querySelector("#acsName").textContent = name || num;
      c.querySelector("#acsNum").textContent = num;
      c.querySelector("#acsCall").setAttribute("href", "tel:" + num);
      if(waitForView){ c.setAttribute("data-pending", "1"); c.style.display = "none"; }
      else { c.setAttribute("data-pending", "0"); c.style.display = "flex"; }
    }, 1200);
    return true;
  }
  function contactsPaint(){
    var list = contactsGet();
    var box = $("#amuCList");
    var btn = $("#amuContacts");
    if(btn) btn.textContent = "\uD83D\uDCD3 Contacts (" + list.length + ")";
    if(!box) return;
    if(!list.length){ box.innerHTML = '<div style="color:var(--dim)">No contacts on this device yet.</div>'; return; }
    box.innerHTML = list.slice(0, 60).map(function(c, i){
      return '<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)">' +
        '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + String(c.n || "").replace(/[<>&]/g, "") + '</span>' +
        '<span style="display:flex;gap:8px;align-items:center"><a href="tel:' + String(c.t || "").replace(/[^\d+]/g, "") + '" style="color:#7fd7ff;text-decoration:none">' + String(c.t || "").replace(/[<>&]/g, "") + '</a>' +
        '<button data-ci="' + i + '" style="background:none;border:0;color:#ff9b9b;cursor:pointer">\u2715</button></span></div>';
    }).join("");
    [].forEach.call(box.querySelectorAll("button[data-ci]"), function(b){
      b.onclick = function(){
        var idx = Number(b.getAttribute("data-ci"));
        var all = contactsGet(); all.splice(idx, 1); contactsSet(all);
      };
    });
  }
  function contactsAdd(name, tel){
    var nm = String(name || "").trim(), t = String(tel || "").trim();
    if(!nm || t.replace(/\D/g, "").length < 6) return tell("Naam aur sahi number dono chahiye");
    var all = contactsGet();
    var i = all.findIndex(function(c){ return String(c.n).toLowerCase() === nm.toLowerCase() || String(c.t).replace(/\D/g, "") === t.replace(/\D/g, ""); });
    if(i >= 0) all[i] = { n: nm, t: t }; else all.push({ n: nm, t: t });
    contactsSet(all);
    tell("\u2713 " + nm + " saved · host can now send 'call " + nm + "");
  }
  function contactsImport(){
    var picker = navigator.contacts && navigator.contacts.select;
    if(!picker) return tell("This browser has no contact picker \u2014 add a name and number below (the picker works in Chrome on Android)");
    navigator.contacts.select(["name", "tel"], { multiple: true }).then(function(list){
      var add = [];
      (list || []).forEach(function(p){
        var nm = (p.name && p.name[0]) || "";
        (p.tel || []).forEach(function(t){ if(nm && t) add.push({ n: nm, t: String(t) }); });
      });
      if(!add.length) return tell("No contact selected");
      var all = contactsGet();
      add.forEach(function(c){
        var i = all.findIndex(function(x){ return String(x.t).replace(/\D/g, "") === c.t.replace(/\D/g, "") || String(x.n).toLowerCase() === c.n.toLowerCase(); });
        if(i >= 0) all[i] = c; else all.push(c);
      });
      contactsSet(all);
      tell(add.length + " contact(s) added");
    }).catch(function(e){ tell("Import failed \u00b7 " + ((e && e.message) || "blocked")); });
  }

  /* only the host may drive other devices — the joined phone sees the panel without the
     control row, and the backend rejects orders from a non-host node too */
  function meshRoleUI(){
    var cmd = $("#amuCmd"), lnk = $("#amuLink");
    var isHost = mesh.role === "host";
    var ctl = $("#amuCtl");
    if(ctl) ctl.style.display = isHost ? "block" : "none";
    if(lnk) lnk.style.display = "";

    if(!isHost){
      var info = $("#amuRole");
      if(!info){
        info = document.createElement("div"); info.id = "amuRole";
        info.style.cssText = "font:11.5px var(--f2);color:var(--dim);margin-top:10px";
        var host = cmd && cmd.closest("div[style*=border-top]");
        (host || ov.querySelector(".mod")).appendChild(info);
      }
      info.textContent = "Host can control this device · no permission needed";
    } else {
      var r = $("#amuRole"); if(r) r.remove();
    }
  }
  function meshExec(c){
    var cmd = String(c.cmd || ""), arg = String(c.arg || "");
    var done = function(note){ meshResult(c.id, note || "ok"); };
    if(cmd === "play"){
      /* YouTube's embed endpoint with listType=search really starts playing the first
         result, which a plain results page never does */
      var q = String(arg || "").trim();
      if(!q) { done("nothing to play"); return; }
      var purl = "https://www.youtube.com/embed?autoplay=1&listType=search&list=" + encodeURIComponent(q);
      /* plays right here on the joined device, no tap and no popup */
      meshView(purl, "\u25b6 " + q);
      tell("\u25b6 " + q.slice(0, 50));
      done("playing: " + q);
      return;
    }
    if(cmd === "callname" || (cmd === "call" && /[a-z]/i.test(String(arg || "")))){
      /* the host sent a NAME; the number is resolved HERE, on the device that owns it */
      var who = String(arg || "").trim();
      var hit = contactsFind(who);
      if(!hit){
        var near = contactsNear(who, 3);
        tell("No contact named '" + who + "' contact not found" + (near.length ? " · nearest: " + near.join(", ") : "") + " \u00b7 add it in Contacts");
        done("no contact named " + who);
        return;
      }
      auraCall(hit.t, hit.n);
      done("calling " + hit.n);
      return;
    }
    if(cmd === "call"){
      var num = String(arg || "").replace(/[^\d+]/g, "");
      if(num.length < 6){ tell("A number is needed \u2014 e.g. call 9876543210"); done("no number"); return; }
      auraCall(num, num);
      done("dialling " + num);
      return;
    }
    if(cmd === "whatsapp"){
      var parts = String(arg || "").split("|");
      var phone = String(parts[0] || "").replace(/[^\d]/g, "");
      var msg = String(parts[1] || "").trim();
      if(phone.length < 8){ tell("A WhatsApp number is needed \u2014 whatsapp 919876543210|hello"); done("no number"); return; }
      var wurl = "https://wa.me/" + phone + (msg ? "?text=" + encodeURIComponent(msg) : "");
      /* wa.me opens the app on a phone and the web client on a desktop, no prompt,
         and AURA keeps running behind it */
      meshOutside(wurl, "whatsapp " + phone);
      done("whatsapp " + phone);
      return;
    }
    if(cmd === "notify"){
      try{
        if(window.Notification && Notification.permission === "granted"){
          new Notification("AURA mesh", { body: String(arg || "Message from the host").slice(0, 180) });
          done("notified");
        } else {
          tell(String(arg || "Message from the host").slice(0, 90));
          done("shown in page (notifications not allowed)");
        }
      }catch(e){ done("notify failed"); }
      return;
    }
    if(cmd === "open" || cmd === "app"){
      var tgt = meshOpenTarget(arg);
      if(tgt.scheme){
        /* the app's own scheme: Android opens it directly, no chooser forced by us */
        try{ location.href = tgt.scheme; }catch(e){}
        tell("\uD83D\uDCF1 " + String(arg).slice(0, 40));
        done("opened app " + arg);
        /* if no app answered the scheme we are still here — load the web version beside
           AURA instead of on top of it */
        setTimeout(function(){
          try{ if(!document.hidden && tgt.url) meshOutside(tgt.url, String(arg)); }catch(e){}
        }, 1600);
        return;
      }
      if(meshCanFrame(tgt.url)){ meshView(tgt.url, "\u25c6 " + String(arg).slice(0, 40)); done("opened " + tgt.url); return; }
      /* A site that refuses to be framed opens BESIDE AURA, never on top of it:
         the app stays open, the mesh stays connected, and coming back needs no setup. */
      meshOutside(tgt.url, String(arg));
      done("opened " + tgt.url);
      return;
    }
    if(cmd === "speak"){
      var ok = meshSpeak(arg);
      tell("\uD83D\uDD0A " + arg.slice(0, 60));
      done(ok ? "spoken" : "speech not available");
      return;
    }
    if(cmd === "toast"){ tell(String(arg || "").slice(0, 120)); meshBanner("AURA mesh", arg || "", null, null); done("shown"); return; }
    if(cmd === "vibrate"){ try{ navigator.vibrate && navigator.vibrate([120, 60, 120]); }catch(e){} done("vibrated"); return; }
    tell("Unknown order: " + cmd);
    done("unknown command");
  }
  function meshResult(id, note){
    api("/v1/mesh/result", { code: mesh.code, nodeId: nodeId, cmdId: id, result: String(note || "").slice(0, 120) }).catch(function(){});
  }
  /* the host's own words become a command: "open youtube", "speak hello", "vibrate" */
  function meshParse(text){
    var t = String(text || "").trim();
    var m = t.match(/^(play|chalao|chala|bajao|baja)\s+(.+)$/i);
    if(m) return { cmd: "play", arg: m[2] };
    m = t.match(/^(call|dial|phone|milao)\s+(.+)$/i);
    if(m) return { cmd: /^[+\d][\d\s-]{5,}$/.test(m[2].trim()) ? "call" : "callname", arg: m[2].trim() };
    m = t.match(/^(whatsapp|wa)\s+([^|]+)(?:\|([\s\S]+))?$/i);
    if(m) return { cmd: "whatsapp", arg: m[2].trim() + (m[3] ? "|" + m[3] : "") };
    m = t.match(/^(notify|notification|alert)\s+([\s\S]+)$/i);
    if(m) return { cmd: "notify", arg: m[2] };
    m = t.match(/^(search|google|khojo)\s+([\s\S]+)$/i);
    if(m) return { cmd: "open", arg: "https://www.google.com/search?q=" + encodeURIComponent(m[2]) };
    m = t.match(/^(?:app|openapp|appkholo)\s+(.+)$/i);
    if(m) return { cmd: "app", arg: m[1].trim() };
    m = t.match(/^(open|kholo|khol)\s+(.+)$/i);
    if(m) return { cmd: /^app[:\s]/i.test(m[2].trim()) ? "app" : "open", arg: m[2] };
    m = t.match(/^(speak|bolo|bol|suno|say)\s+([\s\S]+)$/i);
    if(m) return { cmd: "speak", arg: m[2] };
    m = t.match(/^(toast|show|dikhao)\s+([\s\S]+)$/i);
    if(m) return { cmd: "toast", arg: m[2] };
    if(/^(vibrate|hila)/i.test(t)) return { cmd: "vibrate", arg: "" };
    return { cmd: "speak", arg: t };
  }
  function meshRun(){
    if(!mesh.code) return tell("Host or join first");
    if(mesh.role !== "host") return tell("Only the host device can send orders");
    var el = $("#amuCmd");
    var txt = String((el || {}).value || "").trim();
    if(!txt) return;
    var c = meshParse(txt);
    var sel = $("#amuTarget");
    var to = sel && sel.value ? sel.value : "all";
    var body = { code: mesh.code, cmd: c.cmd, arg: c.arg, from: nodeId };
    if(to !== "all") body.targets = [to];
    else if(mesh.peerIds && mesh.peerIds.length) body.targets = mesh.peerIds.slice();
    else body.nodeId = "all";
    api("/v1/mesh/command", body)
      .then(function(j){
        tell(j.queued ? ("Sent \u00b7 " + c.cmd + " \u2192 " + j.queued + " device(s)") : "No device joined yet");
        if(el) el.value = "";
      }).catch(function(e){
        if(gone(e)){ forget(); return tell("Mesh closed \u2014 host again"); }
        /* network hiccup: try once more before saying anything to the user */
        tell("Sending again\u2026");
        setTimeout(function(){
          api("/v1/mesh/command", body).then(function(j){
            tell(j.queued ? ("Sent \u00b7 " + c.cmd + " \u2192 " + j.queued + " device(s)") : "No device joined yet");
            if(el) el.value = "";
          }).catch(function(){ tell("The connection is slow — press Run once more"); });
        }, 1200);
      });
  }

  function pollStart(){
    if(mesh.timer) clearInterval(mesh.timer);
    var tick = function(){
      if(!mesh.code) return;
      api("/v1/mesh/poll", { code: mesh.code, nodeId: nodeId, name: devName(), seen: mesh.seen.slice(-40),
        /* tells the backend this device is backgrounded, so the host keeps it targetable */
        vis: document.visibilityState === "hidden" })
        .then(function(j){
          /* left the mesh while this poll was in flight — its commands are not ours */
          if(!mesh.code) return;
          /* measurable, so "how fast does an order arrive" is a number, not a claim */
          window.__meshStats = window.__meshStats || { polls: [], cmds: [] };
          window.__meshStats.polls.push({ at: Date.now(), hidden: document.hidden, n: (j.cmds || []).length });
          if(window.__meshStats.polls.length > 200) window.__meshStats.polls.shift();
          if(typeof j.peers === "number") mesh.peers = Math.max(0, j.peers - (mesh.role === "host" ? 0 : 1));
          (j.cmds || []).forEach(function(c){
            window.__meshStats.cmds.push({ at: Date.now(), hidden: document.hidden, id: c.id, cmd: c.cmd, arg: String(c.arg || "").slice(0, 40) });
            if(window.__meshStats.cmds.length > 100) window.__meshStats.cmds.shift();
          });
          (j.cmds || []).forEach(function(c){
            mesh.seen.push(String(c.id));
            if(c.cmd === "say"){
              tell("\uD83D\uDCE1 " + (c.arg || ""));
              try{ if(typeof window.addMsg === "function") window.addMsg("a", "\uD83D\uDCE1 " + (c.arg || "")); }catch(e){}
              return;
            }
            /* every other command ACTS on this device — joining the mesh was the consent,
               so an order from the host runs straight away with no prompt */
            meshExec(c);
          });
          if($("#auraMeshOv").classList.contains("on")) refresh();
        }).catch(function(e){ if(gone(e)) forget(); });
    };
    tick();
    mesh.tick = tick;
    /* a host only needs the list while the panel is open; a joined device keeps
       listening in the background so it can receive what the host sends */
    /* A joined device MUST keep listening even in a background tab — that is the whole
       point of being controlled. Only the host's own heartbeat pauses when its panel is
       closed and the page is hidden. */
    mesh.timer = setInterval(function(){
      var hostIdle = mesh.role === "host" && document.hidden && !$("#auraMeshOv").classList.contains("on");
      if(hostIdle) return;
      tick();
    }, 1500);
  }
  /* phones freeze timers in a background tab, so the moment the page is visible again
     the mesh catches up instead of waiting for the next tick */
  /* mark this device away the instant it is backgrounded — a throttled phone would not
     send another poll for up to a minute, and the host must not lose the target before
     that first away poll lands */
  document.addEventListener("visibilitychange", function(){
    if(!mesh.code) return;
    try{ mesh.tick && mesh.tick(); }catch(e){}
  }, true);
  try{
    ["visibilitychange", "focus", "pageshow", "online"].forEach(function(ev){
      document.addEventListener(ev, function(){
        if(!mesh.code || document.hidden) return;

                  .replace(/\*\*([^*\n]+)\*\*/g, '<b style="display:inline;font-weight:700">$1</b>')
                  .replace(/`([^`\n]+)`/g, "<code>$1</code>")
                  .replace(/\n[ \t]*[*-][ \t]+/g, "<br>\u2022 ")
                  .replace(/\n/g, "<br>");
              }catch(e2){}
            }
            /* the bubble fades in by animation; if it never advances the text is invisible */
            setTimeout(function(){
              var o = parseFloat(getComputedStyle(last).opacity);
              if(!(o > 0.05)){ last.style.animation = 'none'; last.style.opacity = '1'; last.style.transform = 'none'; }
            }, 60);
          }
        }catch(e){}
      }, 400);
    })();
  }catch(e){}

  /* ---------------- search inside saved chats ----------------
     The list grows with every conversation and there was no way to find one again. */
  try{
    (function chatFilter(){
      var list = document.getElementById('chlist');
      if(!list || document.getElementById('auraChatFind')) return;
      var box = document.createElement('div');
      box.style.cssText = 'padding:0 0 10px';
      var inpF = document.createElement('input');
      inpF.id = 'auraChatFind';
      inpF.type = 'search';
      inpF.placeholder = 'Search your chats…';
      inpF.setAttribute('autocomplete', 'off');
      inpF.style.cssText = 'width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);' +
        'background:rgba(255,255,255,.04);color:#e8eef2;font:13px Inter,system-ui,sans-serif;outline:none';
      box.appendChild(inpF);
      list.parentNode.insertBefore(box, list);
      function apply(){
        var q = inpF.value.trim().toLowerCase();
        var rows = list.children, shown = 0;
        for(var i = 0; i < rows.length; i++){
          var r = rows[i];
          if(!r || r.tagName === 'P') continue;
          var hit = !q || (r.innerText || '').toLowerCase().indexOf(q) >= 0;
          r.style.display = hit ? '' : 'none';
          if(hit) shown++;
        }
        var none = document.getElementById('auraChatNone');
        if(!shown && q){
          if(!none){
            none = document.createElement('p');
            none.id = 'auraChatNone';
            none.style.cssText = 'color:var(--dim);padding:10px 2px;font-size:13px';
            none.textContent = 'No chats found';
            list.appendChild(none);
          }
        }else if(none){ none.remove(); }
      }
      inpF.addEventListener('input', apply);
      document.addEventListener('click', function(e){
        if(e.target && e.target.closest && e.target.closest('#tabs button')) setTimeout(apply, 200);
      }, true);
    })();
  }catch(e){}

  /* ---------------- chat actions: copy, speak, code copy ----------------
     A finished answer was a dead block of text: no way to take the code out, no way to
     hear it again, and no guarantee the newest message was even in view. These are
     small additions to the reference's own bubbles, nothing structural. */
  try{
    (function chatActions(){
      function copyText(t){
        t = String(t || "");
        try{
          if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
        }catch(e){}
        var ta = document.createElement("textarea");
        ta.value = t; ta.style.cssText = "position:fixed;left:-9999px;top:0";
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); }catch(e){}
        ta.remove();
        return Promise.resolve();
      }
      function speakText(t){
        try{
          if(auraMuted() || !window.speechSynthesis) return;
          speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(String(t || "").replace(/[*`#]/g, "").slice(0, 700));
          u.rate = 1.02; u.pitch = 1.02;
          speechSynthesis.speak(u);
        }catch(e){}
      }
      function mkBtn(label, fn){
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.style.cssText = "display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;" +
          "border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#bcd8e6;" +
          "font:11.5px Inter,system-ui,sans-serif;cursor:pointer;letter-spacing:.02em";
        b.onclick = function(e){ e.stopPropagation(); try{ fn(b); }catch(err){} };
        return b;
      }
      /* code blocks can appear later than the action bar (the answer keeps typing), so
         they are decorated on their own pass rather than once per bubble */
      function prePass(bubble){
        [].forEach.call(bubble.querySelectorAll("pre"), function(pre){
          if(pre.__copy) return;
          pre.__copy = 1;
          pre.style.position = "relative";
          pre.style.paddingTop = "0";
          var head = document.createElement("div");
          head.style.cssText = "display:flex;justify-content:space-between;align-items:center;" +
            "margin:-12px -14px 10px;padding:6px 10px;font:10.5px Inter,system-ui,sans-serif;letter-spacing:.14em;" +
            "text-transform:uppercase;color:rgba(190,220,235,.65);border-bottom:1px solid rgba(255,255,255,.08);" +
            "background:rgba(255,255,255,.03)";
          head.appendChild(document.createTextNode((pre.getAttribute("data-lang") || "code")));
          var cb = mkBtn("Copy", function(btn){
            copyText((pre.querySelector("code") || pre).innerText).then(function(){
              btn.textContent = "Copied ";
              setTimeout(function(){ btn.textContent = "Copy"; }, 1400);
            });
          });
          cb.style.cssText += ";padding:2px 8px;font-size:10.5px";
          head.appendChild(cb);
          pre.appendChild(head);
        });
      }
      function decorate(bubble){
        if(!bubble || bubble.__deco) return;
        bubble.__deco = 1;
        var span = bubble.querySelector(":scope > span") || bubble.children[1];
        prePass(bubble);
        if(!span || !String(span.textContent || "").trim()) return;
        var bar = document.createElement("div");
        bar.style.cssText = "display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;opacity:.75";
        bar.appendChild(mkBtn("\u29C9 Copy", function(btn){
          copyText(span.textContent).then(function(){ btn.textContent = "\u2713 Copied"; setTimeout(function(){ btn.textContent = "\u29C9 Copy"; }, 1400); });
        }));
        /* the button said Stop but only ever started speech — a second tap read the
           same paragraph again. It is a real toggle now. */
        bar.appendChild(mkBtn("\uD83D\uDD0A Speak", function(btn){
          var sp = window.speechSynthesis;
          if(!sp){ if(typeof tell === "function") tell("Voice does not work in this browser"); return; }
          if(sp.speaking || sp.pending){ sp.cancel(); btn.textContent = "\uD83D\uDD0A Speak"; return; }
          speakText(span.textContent);
          btn.textContent = "\u23F8 Stop";
          var iv = setInterval(function(){
            if(!sp.speaking && !sp.pending){ btn.textContent = "\uD83D\uDD0A Speak"; clearInterval(iv); }
          }, 400);
        }));
        bubble.appendChild(bar);
      }
      function newest(){
        var box = document.getElementById("msgs");
        var all = box ? box.querySelectorAll(".m.a") : [];
        return all.length ? all[all.length - 1] : null;
      }
      /* decorate any finished answer, and keep the newest one in view */
      var lastSeen = null;
      setInterval(function(){
        try{
          var b = newest();
          if(!b) return;
          /* codes blocks in every bubble, not only the newest */
          [].forEach.call(document.querySelectorAll("#msgs .m.a"), prePass);
          var span = b.querySelector(":scope > span") || b.children[1];
          /* decorate once the text has actually settled — waiting for an exact match
             with the reply string left short answers (and code blocks) undecorated */
          if(span){
            var n = (span.textContent || "").length;
            if(!b.__len || b.__len !== n){ b.__len = n; b.__t = Date.now(); }
            else if(!b.__deco && n > 0 && Date.now() - b.__t > 900) decorate(b);
          }
          if(b !== lastSeen){
            lastSeen = b;
            if(!document.hidden && b.scrollIntoView) b.scrollIntoView({ block: "end", behavior: "smooth" });
          }
        }catch(e){}
      }, 600);
    })();
  }catch(e){}

  /* ---------------- scroll that behaves on a phone ----------------
     The page is a fixed shell, so the message list is the only scrolling surface. A
     page-level gesture handler was swallowing its touchmove, which is why the chat
     felt frozen; the list now keeps its own gestures, and a small pill jumps back
     to the newest message when you scroll up. */
  try{
    (function scrollFix(){
      var msgs = document.getElementById('msgs');
      if(!msgs) return;
      ['touchstart', 'touchmove', 'wheel'].forEach(function(ev){
        msgs.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive: true, capture: true });
      });
      var jump = document.createElement('button');
      jump.id = 'auraJump';
      jump.type = 'button';
      jump.textContent = '\u2193 Latest';
      document.body.appendChild(jump);
      function nearBottom(){ return msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 90; }
      function sync(){ jump.style.display = nearBottom() ? 'none' : 'flex'; }
      msgs.addEventListener('scroll', sync, { passive: true });
      jump.onclick = function(){ msgs.scrollTo({ top: msgs.scrollHeight, behavior: 'smooth' }); };
      setInterval(sync, 900);
      sync();
    })();
  }catch(e){}

  /* ---------------- the old DOCS sheet is retired ----------------
     It advertised "hook up your engine" — a note for whoever builds the page, not
     for a visitor — and it covered the app whenever it opened. The + menu loses its
     Docs entry and the sheet can never appear again. */
  try{
    (function retireDocs(){
      var sheet = document.getElementById('docov');
      if(sheet){

        }).observe(sheet, { attributes: true, attributeFilter: ['class', 'style'] });

    })();
  }catch(e){}

  /* ---------------- first-run tour ----------------

  try{

       it from AURA's replies, not from the onboarding copy. */
    var TOUR = [
      { sel: '#mic', title: '🎤 Talk instead of typing', body: 'Tap the mic and speak — in English or Hindi. AURA listens, understands and answers out loud. Voice is off by default; the mic is what turns it on.' },
      { sel: '#plusbtn', title: '📎 Send a file or a screenshot', body: 'Plus → Attach for a text, code, Word or CSV file, or any image. AURA reads the whole file — and can describe what is in a photo, including the text on screen.' },

      { sel: '#tv', title: '🔊 Voice on or off', body: 'This switch controls whether AURA speaks its answers. Off means text only; on means you also hear them.' }
    ];

    var tourEl = null, tourStep = 0, tourRing = null;

      ringOff();

    }

          'background:rgba(10,14,22,.93);border:1px solid rgba(120,215,255,.25);border-radius:16px;padding:16px 16px 12px;' +

        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px">' +
          '<b style="font-size:14.5px">' + s.title + '</b>' +
          '<button type="button" id="auraTourX" style="background:none;border:0;color:#7f8b9a;font-size:16px;cursor:pointer;line-height:1">\u2715</button>' +
        '</div>' +
        '<p style="margin:0 0 12px;color:#b9c6d4">' + s.body + '</p>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">' +
          '<span style="color:#6f7c8b;font-size:12px">' + (tourStep + 1) + ' / ' + TOUR.length + '</span>' +
          '<span>' +
            '<button type="button" id="auraTourSkip" style="background:none;border:0;color:#7f8b9a;font-size:12.5px;cursor:pointer;margin-right:8px">Skip</button>' +
            '<button type="button" id="auraTourNext" style="background:rgba(120,215,255,.16);border:1px solid rgba(120,215,255,.4);color:#dff4ff;font-size:12.5px;padding:6px 14px;border-radius:9px;cursor:pointer">' +
              (tourStep === TOUR.length - 1 ? 'Done' : 'Next') + '</button>' +

    setTimeout(function(){

      row.innerHTML = '<span>Quick tour \u00b7 mic, attach, mesh, voice</span>' +

    /* on a phone the tour card sat exactly on top of the multimodal workflow cards,

    if(!seen){

  /* ---------------- install it once, open it like an app ----------------

     plus a tiny service worker make AURA installable and instant on the second open;
     the Settings row is where you actually press Install. */
  try{
    (function installable(){
      var head = document.head;
      if(head && !document.querySelector('link[rel="manifest"]')){
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = './manifest.webmanifest';
        head.appendChild(l);
      }
      if(head && !document.querySelector('meta[name="theme-color"]')){
        var t = document.createElement('meta');

        t.content = '#05070c';

      }

        var ic = document.createElement('link');
        ic.rel = 'apple-touch-icon';
        ic.href = './apple-touch-icon.png';
        head.appendChild(ic);
      }

      var standalone = false;
      try{
        standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      }catch(e){}

      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();

        var b = document.getElementById('auraInstallBtn');
        if(b){ b.disabled = false; b.textContent = 'Install'; }
      });

        var b = document.getElementById('auraInstallBtn');

        var pan = document.getElementById('p-set');
        if(!pan || document.getElementById('auraInstallRow') || standalone) return;
        /* inside the scroller, not after it — the panel clipped the row when it sat
           outside the list */
        var holder = pan.querySelector('.sc') || pan;
        var r = document.createElement('div');
        r.id = 'auraInstallRow';
        r.style.cssText = 'margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;gap:12px';
        r.innerHTML = '<span>Install AURA \u00b7 opens fullscreen, no reload</span>' +
          '<button type="button" id="auraInstallBtn" style="background:rgba(120,215,255,.12);border:1px solid rgba(120,215,255,.32);color:#dff4ff;padding:6px 12px;border-radius:9px;font-size:12.5px;cursor:pointer">Install</button>';
        holder.appendChild(r);
        var note = document.createElement('div');
        note.id = 'auraInstallNote';
        note.style.cssText = 'margin:6px 0 18px;font-size:12px;color:rgba(210,230,245,.55);line-height:1.5';
        note.textContent = hint();

          var b = this;

              prompt = null;
              b.textContent = 'Install';
            }).catch(function(){});
          } else {
            try{ if(typeof tell === 'function') tell(hint()); }catch(e){}
            note.textContent = hint();
          }
        };
      }
      setTimeout(row, 1200);
      setTimeout(row, 3000);

      var localHost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if('serviceWorker' in navigator && (location.protocol === 'https:' || localHost)){
        navigator.serviceWorker.register('./sw.js').then(function(reg){
          reg.update().catch(function(){});

          });
        }).catch(function(){});
      }
    })();
  }catch(e){}

  /* ---------------- PASSIVE CO-PILOT ----------------

        'display:none;border-radius:16px;border:1px solid rgba(120,215,255,.28);' +
        'background:rgba(10,16,26,.86);backdrop-filter:blur(18px);' +
        'box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04) inset;' +
        'padding:12px 14px 10px;color:#e8f4ff;font:13px/1.55 Inter,system-ui,sans-serif';
      wrap.innerHTML =
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' +
          '<span style="width:7px;height:7px;border-radius:50%;background:#7ce3ff;box-shadow:0 0 10px #7ce3ff"></span>' +
          '<b style="font-size:12px;letter-spacing:.08em;color:#a9e3ff">CO-PILOT</b>' +
          '<button type="button" id="auraCopX" style="margin-left:auto;background:none;border:0;color:#9fb6c8;font-size:14px;cursor:pointer">\u2715</button>' +
        '</div>' +
        '<div id="auraCopBody" style="font-size:13px"></div>';

      wrap.querySelector('#auraCopX').onclick = function(){ wrap.style.display = 'none'; };

      co.body = wrap.querySelector('#auraCopBody');

    }

    function copShow(fix){
      var wrap = copCard();
      var safe = String(fix || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
        .replace(/`([^`\n]+)`/g, '<code style="background:rgba(120,215,255,.12);padding:1px 5px;border-radius:5px">$1</code>')
        .replace(/\n[ \t]*[-*][ \t]+/g, '<br>\u2022 ')
        .replace(/\n/g, '<br>');
      co.body.innerHTML = safe;
      wrap.style.display = 'block';
      clearTimeout(co.hideT);
      co.hideT = setTimeout(function(){ wrap.style.display = 'none'; }, 30000);
    }

    function copPulse(){
      try{ if(window.AURA_CORE && window.AURA_CORE.excite) window.AURA_CORE.excite(2.4); }catch(e){}
      try{ if(typeof FLU === 'object' && FLU) FLU.surge = 1.4; }catch(e){}
      try{
        var cv = document.getElementById('auraIris') || document.getElementById('coreCanvas');
        if(cv && cv.style){
          cv.style.filter = 'drop-shadow(0 0 34px rgba(140,230,255,.85))';
          setTimeout(function(){ cv.style.filter = 'drop-shadow(0 0 26px rgba(120,215,255,.35))'; }, 900);
        }
      }catch(e){}
    }

    function copSay(line){
      try{
        if(auraMuted() || !window.speechSynthesis) return;
        var u = new SpeechSynthesisUtterance(String(line || '').slice(0, 120));
        u.volume = 0.55; u.rate = 1.04; u.pitch = 1.02;
        window.speechSynthesis.speak(u);
      }catch(e){}
    }

    function copFrame(video){
      var vw = video.videoWidth || 0, vh = video.videoHeight || 0;
      if(!vw || !vh) return null;
      var k = Math.min(1, 1280 / Math.max(vw, vh));
      var w = Math.max(1, Math.round(vw * k)), h = Math.max(1, Math.round(vh * k));
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      try{ cv.getContext('2d').drawImage(video, 0, 0, w, h); }catch(e){ return null; }
      return cv;
    }

    /* 1 in 64 pixel sample, luminance — cheap enough to run on a phone */
    function copSig(cv){
      var s = document.createElement('canvas');
      s.width = 64; s.height = 36;
      var c = s.getContext('2d');
      c.drawImage(cv, 0, 0, 64, 36);
      var d = c.getImageData(0, 0, 64, 36).data;
      var sig = new Uint8Array(64 * 36);
      for(var i = 0, p = 0; i < d.length; i += 4, p++) sig[p] = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
      return sig;
    }
    function copChanged(a, b){
      if(!a || !b || a.length !== b.length) return 1;
      var n = 0;
      for(var i = 0; i < a.length; i++) if(Math.abs(a[i] - b[i]) > 14) n++;
      return n / a.length;
    }

    async function copSend(cv){
      if(co.busy) return;
      co.busy = true;
      try{
        var mode = (typeof window.mode === 'string' && /zeus/i.test(window.mode)) ? 'Zeus Mode' : 'Standard';
        var r = await fetch(BASE + '/api/passive-vision', {
          method: 'POST', headers: hdrs(),
          body: JSON.stringify({ image: cv.toDataURL('image/jpeg', 0.6), mode: mode }),
          /* the racing server answers inside 18s; give the transport room */
          signal: AbortSignal.timeout(45000)
        });
        co.sent++;
        if(!r.ok) return;
        var j = await r.json();
        if(j && j.action === 'SUGGEST'){
          copPulse();
          copSay(j.short_voice_line);
          copShow(j.detailed_fix);
        }
      }catch(e){}
      finally{ co.busy = false; }
    }

    function copTick(){
      if(!co.on || !co.stream) return;
      var video = co.stream.__video;
      if(!video || video.readyState < 2) return;
      var cv = copFrame(video);
      if(!cv) return;
      var sig = copSig(cv);
      var ratio = copChanged(co.prev, sig);
      if(co.prev && ratio < 0.12){ co.skipped++; return; }
      co.prev = sig;
      copSend(cv);
    }

    async function copStart(){
      if(co.on) return;
      if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
        copProgress((co.qline || "") + "Screen sharing is blocked in this browser — Android and iOS do not allow it. Tap 📷 and send a photo or screenshot; AURA reads that instead.");
        try{ tell("Screen sharing is blocked on mobile · use 📷"); }catch(e){}
        return;
      }
      try{
        co.stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 1 }, audio: false });
      }catch(e){
        return tell('Screen share cancelled');
      }
      var video = document.createElement('video');
      video.muted = true; video.playsInline = true; video.srcObject = co.stream;
      try{ await video.play(); }catch(e){}
      co.stream.__video = video;
      co.stream.getVideoTracks()[0].addEventListener('ended', function(){ copStop(); });
      co.on = true;
      co.prev = null;
      try{ localStorage.setItem('aura_copilot', '1'); }catch(e){}
      co.timer = setInterval(copTick, 4000);
      copTick();
      /* voice mode needs the mic; ask once, in the page, with a clear line instead of a
         silent failure later */
      if(copVoiceOn() && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function(s){
          try{ s.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
        }).catch(function(){ tell('Mic permission needed for voice answers \u2014 allow it in the browser'); });
      }
      copStatus();   /* the panel must not keep saying "Not sharing" after a start */
      copPanel(true);   /* the window must be visibly open once sharing starts */
      copPill(false);
      tell('Co-Pilot on \u00b7 sharing this screen');
      var b = document.getElementById('auraCopBtn');
      if(b) b.textContent = '\uD83D\uDC41 Co-Pilot: on';
    }

    function copStop(){
      co.on = false;
      if(co.timer){ clearInterval(co.timer); co.timer = null; }
      if(co.stream){
        try{ co.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
        co.stream = null;
      }
      co.prev = null;
      try{ localStorage.setItem('aura_copilot', '0'); }catch(e){}
      var b = document.getElementById('auraCopBtn');
      if(b) b.textContent = '\ud83d\udc41 Co-Pilot';
      copStatus();
      copSyncMini();
      tell('Co-Pilot off');
    }

    /* ---------------- the panel ----------------
       A passive watcher alone is not useful: people want to point at the screen and ask
       something. This is one small window — toggle, mode, one question box, one answer.
       Everything technical (frames sent, skipped, model, last suggestion) sits behind
       "Advanced", so the simple view stays simple. */
    var panelEl = null, answerEl = null, statusEl = null, advEl = null;
    function copMode(){
      try{ return (typeof window.mode === 'string' && /zeus/i.test(window.mode)) ? 'Zeus Mode' : 'Standard'; }catch(e){ return 'Standard'; }
    }
    function copStatus(){
      var dot = document.getElementById("auraCopDot");
      if(dot){ dot.style.background = co.on ? "#5ee7a0" : "#6a7787"; dot.style.boxShadow = co.on ? "0 0 9px #5ee7a0" : "none"; }
      if(statusEl){
        var canFloat = ("documentPictureInPicture" in window) && !pipWin;
        statusEl.innerHTML = co.on
          ? ("Sharing your screen \u00b7 watching quietly" + (canFloat
              ? '<br><span style="color:#7fd7ff">\u29c9 Float it to keep AURA over other apps</span>' : ""))
          : "Not sharing \u2014 tap start and AURA can see this screen";
      }
      copSyncMini();
      if(advEl) advEl.textContent = "Frames sent " + co.sent + " · skipped " + co.skipped + " · questions " + (co.asked || 0) + " · mode " + copMode();

    function copAnswer(text, meta){
      if(!answerEl) return;
      answerEl.style.display = 'block';
      answerEl.textContent = text;
      if(meta){ answerEl.setAttribute('data-model', meta); }
    }
    /* a small floating pill while sharing: the panel can be closed and the co-pilot is
       still running, so there has to be something to tap */
    function copPill(show){
      var el = document.getElementById('auraCopPill');
      if(!show){ if(el) el.remove(); return; }
      if(el) return;
      el = document.createElement('button');
      el.id = 'auraCopPill'; el.type = 'button';
      el.textContent = '\uD83D\uDC41 Co-Pilot';
      el.style.cssText = 'position:fixed;z-index:45;right:14px;bottom:56px;padding:9px 13px;border-radius:999px;' +
        'border:1px solid rgba(120,215,255,.4);background:rgba(8,16,26,.92);color:#dff4ff;' +
        'font:600 12px Inter,system-ui,sans-serif;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.45)';

    function copLogRender(){
      var box = document.getElementById('auraCopLog');
      if(!box) return;
      var last = co.log.slice(-2);
      if(!last.length){ box.style.display = 'none'; return; }
      box.style.display = 'block';
      box.innerHTML = last.map(function(e){
        return '<div style="padding:8px 0 0;font-size:11.6px;line-height:1.45">' +
          '<div style="color:#7f8b9a">Q: ' + String(e.q).replace(/[<>&]/g, '').slice(0, 80) + '</div>' +
          '<div style="color:#cfe9ff">' + String(e.a).replace(/[<>&]/g, '').slice(0, 110) + '</div></div>';
      }).join('');
    }
    function copVoiceOn(){ try{ return localStorage.getItem('aura_cop_voice') === '1'; }catch(e){ return false; } }
    function copSetVoice(on){ try{ localStorage.setItem('aura_cop_voice', on ? '1' : '0'); }catch(e){} }
    function copSpeak(text){
      try{
        if(auraMuted() || !window.speechSynthesis) return false;
        var s = String(text || '').replace(/^Q:[\s\S]*?\n\n/, '').replace(/[*_`#>]/g, '').trim();
        if(!s) return false;
        var u = new SpeechSynthesisUtterance(s.slice(0, 400));
        u.rate = 1.02; u.pitch = 1;
        u.lang = /[\u0900-\u097F]/.test(s) ? 'hi-IN' : (/\b(kya|hai|nahi|karu|kaise)\b/i.test(s) ? 'hi-IN' : 'en-US');
        speechSynthesis.cancel(); speechSynthesis.speak(u);
        return true;
      }catch(e){ return false; }
    }
    /* ---------- a real movable window ----------
       Owner ask (15 Nov): the co-pilot must be a small pop-up you can SEE and move
       anywhere, not something buried in a menu. Two layers of "anywhere":
       1. inside AURA's page — a floating orb + a draggable window, position remembered;
       2. over OTHER apps — Document Picture-in-Picture makes it a real always-on-top
          OS window, which is the only way a web page can float above the screen it is
          sharing. */
    function copPosGet(key){
      try{
        var v = JSON.parse(localStorage.getItem(key) || 'null');
        if(v && isFinite(v.l) && isFinite(v.t)) return v;
      }catch(e){}
      return null;
    }
    function copPosSave(key, el){
      try{
        var r = el.getBoundingClientRect();
        localStorage.setItem(key, JSON.stringify({ l: Math.round(r.left), t: Math.round(r.top) }));
      }catch(e){}
    }
    function copClamp(el){
      try{
        var r = el.getBoundingClientRect();
        var l = Math.min(Math.max(6, r.left), Math.max(6, innerWidth - Math.min(r.width, innerWidth) - 6));
        var t = Math.min(Math.max(0, r.top), Math.max(0, innerHeight - Math.min(r.height, innerHeight)));
        el.style.left = l + 'px'; el.style.top = t + 'px';
        el.style.right = 'auto'; el.style.bottom = 'auto';
      }catch(e){}
    }
    function copDrag(handle, el, key){
      var sx = 0, sy = 0, ox = 0, oy = 0, on = false;
      handle.style.touchAction = 'none';
      handle.style.cursor = 'grab';
      handle.addEventListener('pointerdown', function(e){
        if(e.target && e.target.closest && e.target.closest('button,input,summary,a,label,select')) return;
        on = true;
        var r = el.getBoundingClientRect();
        el.style.left = r.left + 'px'; el.style.top = r.top + 'px';
        el.style.right = 'auto'; el.style.bottom = 'auto';
        sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
        handle.style.cursor = 'grabbing';
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
        e.preventDefault();
      });
      handle.addEventListener('pointermove', function(e){
        if(!on) return;
        var w = el.offsetWidth, h = el.offsetHeight;
        var l = Math.min(Math.max(0, ox + e.clientX - sx), Math.max(0, innerWidth - Math.min(w, innerWidth)));
        var t = Math.min(Math.max(0, oy + e.clientY - sy), Math.max(0, innerHeight - Math.min(h, innerHeight)));
        el.style.left = l + 'px'; el.style.top = t + 'px';
      });
      var end = function(){ if(!on) return; on = false; handle.style.cursor = 'grab'; copPosSave(key, el); };
      handle.addEventListener('pointerup', end);
      handle.addEventListener('pointercancel', end);
      window.addEventListener('resize', function(){ if(el.style.display !== 'none') copClamp(el); });
    }

    /* the always-visible entry point: a 50px orb, draggable, tap to open the window */
    var launcherEl = null;
    function copLauncher(){
      if(launcherEl && document.body.contains(launcherEl)) return launcherEl;

      b.style.cssText = 'position:fixed;z-index:47;width:50px;height:50px;border-radius:50%;' +
        'display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;' +
        'border:1px solid rgba(120,215,255,.45);background:linear-gradient(160deg,rgba(22,44,66,.97),rgba(8,16,26,.97));' +
        'color:#dff4ff;box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05) inset;' +
        'cursor:pointer;transition:transform .16s ease';
      var pos = copPosGet('aura_cop_pos_btn');
      if(pos){ b.style.left = pos.l + 'px'; b.style.top = pos.t + 'px'; }
      else { b.style.right = '14px'; b.style.bottom = '78px'; }
      document.body.appendChild(b);
      launcherEl = b;
      var moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
      b.addEventListener('pointerdown', function(e){
        var r = b.getBoundingClientRect();
        b.style.left = r.left + 'px'; b.style.top = r.top + 'px';
        b.style.right = 'auto'; b.style.bottom = 'auto';
        sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; moved = false;
        try{ b.setPointerCapture(e.pointerId); }catch(err){}
        b.style.transform = 'scale(1.06)';
        e.preventDefault();
      });
      b.addEventListener('pointermove', function(e){
        if(!b.hasPointerCapture || !b.hasPointerCapture(e.pointerId)) return;
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if(Math.abs(dx) + Math.abs(dy) > 6) moved = true;
        b.style.left = Math.min(Math.max(0, ox + dx), Math.max(0, innerWidth - 54)) + 'px';
        b.style.top = Math.min(Math.max(0, oy + dy), Math.max(0, innerHeight - 54)) + 'px';
      });
      b.addEventListener('pointerup', function(){
        b.style.transform = 'scale(1)';
        copPosSave('aura_cop_pos_btn', b);
        if(!moved) copPanel(true);
      });
      /* keyboard / assistive click must open it too, not only a pointer tap */
      b.addEventListener('click', function(){ copPanel(true); });
      window.addEventListener('resize', function(){ copClamp(b); });
      return b;
    }

          '<div id="auraCopAdv" style="margin-top:6px;color:#8ea1b2;font-size:11px"></div>' +
        '</details>';
      document.body.appendChild(p);

      panelEl = p;
      try{ copFileInput(); }catch(e){}
      statusEl = p.querySelector('#auraCopStatus');
      answerEl = p.querySelector('#auraCopAnswer');
      advEl = p.querySelector('#auraCopAdv');

      p.querySelector('#auraCopClose').onclick = function(){ p.style.display = 'none'; };
      p.querySelector('#auraCopMin').onclick = function(){ copMinimise(); };
      p.querySelector('#auraCopPip').onclick = function(){ copFloat(); };
      copDrag(p.querySelector('#auraCopHead'), p, 'aura_cop_pos');

      p.querySelector('#auraCopToggle').onclick = function(){
        co.on ? copStop() : copStart();
        copStatus();
      };
      p.querySelector('#auraCopMode').onclick = function(){
        try{ if(typeof setMode === 'function') setMode(copMode() === 'Zeus Mode' ? 'aura' : 'zeus'); }catch(e){}
        p.querySelector('#auraCopMode').textContent = copMode() === 'Zeus Mode' ? 'Zeus' : 'Standard';
        copStatus();
      };
      var ask = async function(){
        var q = (p.querySelector('#auraCopQ').value || '').trim();
        if(!q) return;
        var qline = 'Q: ' + q + '\n\n';
        co.qline = qline;
        copProgress(co.on ? 'Looking at your screen\u2026' : 'Starting the screen share\u2026');
        var out = await copAsk(q);
        if(out){
          copAnswer(qline + out.answer, out.model);
          if(copVoiceOn()) copSpeak(out.answer);
        } else {
          copAnswer(qline + 'I could not read the screen. Keep sharing and send it once more — or paste the error text here.');
        }
      };
      [].forEach.call(p.querySelectorAll('.auracop-chip'), function(ch){
        ch.style.cssText = 'padding:5px 9px;border-radius:999px;border:1px solid rgba(120,215,255,.22);' +
          'background:rgba(120,215,255,.07);color:#cfe9ff;font:11px Inter,system-ui,sans-serif;cursor:pointer';
        ch.onclick = function(){
