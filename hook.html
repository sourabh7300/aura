        };
      });
      var shut = p.querySelector('#auraCopShut');
      if(shut) shut.onclick = function(){ try{ speechSynthesis.cancel(); }catch(e){} tell('Voice stopped'); };
      var voiceCb = p.querySelector('#auraCopVoice');
      if(voiceCb) voiceCb.checked = copVoiceOn();
      if(voiceCb) voiceCb.onchange = function(){ copSetVoice(voiceCb.checked); if(voiceCb.checked) copSpeak('Voice answers on'); };
      var micBtn = p.querySelector('#auraCopMic');
      if(micBtn) micBtn.onclick = function(){
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR) return copAnswer('Voice input is not supported in this browser. Type the question instead.');
        try{
          var r = new SR(); r.lang = 'en-IN'; r.interimResults = false; r.maxAlternatives = 1;
          copAnswer('\uD83C\uDFA4 Listening\u2026');
          r.onresult = function(ev){
            var said = String(ev.results[0][0].transcript || '').trim();
            if(!said) return copAnswer('I did not catch that \u2014 try again.');
            p.querySelector('#auraCopQ').value = said;
            ask();
          };
          r.onerror = function(e){ copAnswer('Mic error: ' + (e && e.error || 'not allowed') + '. Type the question instead.'); };
          r.start();
        }catch(e){ copAnswer('Mic unavailable: ' + e.message); }
      };
      var photoBtn = p.querySelector('#auraCopPhoto');
      if(photoBtn) photoBtn.onclick = function(){ copPickPhoto(); };
      p.querySelector('#auraCopAsk').onclick = ask;
      p.querySelector('#auraCopQ').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); ask(); } });
      /* the PiP button only exists where the browser can float a real window */
      if(!('documentPictureInPicture' in window)) p.querySelector('#auraCopPip').style.display = 'none';
      return p;
    }

    /* float the panel over other apps as a real always-on-top window */
    var pipWin = null;
    async function copFloat(){
      try{
        if(pipWin){ try{ pipWin.close(); }catch(e){} pipWin = null; }
        var p = buildPanel();
        var win = null;
        if('documentPictureInPicture' in window){
          /* Chrome only opens this window for a REAL tap. Without one the promise can sit
             pending for ever, which looked like a dead button — so it gets a deadline and
             an honest message instead of silence. */
          win = await Promise.race([
            window.documentPictureInPicture.requestWindow({ width: 360, height: 470 }),
            new Promise(function(_, rej){
              setTimeout(function(){ rej(new Error('the browser did not open the floating window — tap \u29c9 again, and allow popups for this site')); }, 6000);
            })
          ]);
        } else {
          /* no Document PiP (Firefox/Safari/older Chrome): a plain popup still gives a
             separate window you can drag beside another app. It is NOT always-on-top,
             and the label says so instead of pretending. */
          win = window.open('', 'auraCopPop', 'width=372,height=520,menubar=no,toolbar=no,location=no,status=no');
          if(!win) return tell('Popup blocked \u2014 allow popups for this site, then tap \u29c9 again');
        }
        pipWin = win;
        /* the window has to be recognisable at a glance — in the OS task list and in
           "is it really floating?" checks */
        try{ pipWin.document.title = 'AURA Co-Pilot \u00b7 floating'; }catch(e){}
        try{ var mt = pipWin.document.createElement('meta'); mt.name = 'aura-pip'; pipWin.document.head.appendChild(mt); }catch(e){}
        /* carry the page styles over so the panel looks the same in the new window */
        var st = pipWin.document.createElement('style');
        st.textContent = 'html,body{margin:0;height:100%;background:#070c14;color:#e9f5ff;font:13px/1.5 Inter,system-ui,sans-serif;overflow:hidden}' +
          '#auraCopPanel{position:static!important;display:block!important;width:100%!important;height:100%!important;' +
          'border:0!important;border-radius:0!important;box-shadow:none!important;max-height:100%!important}' +
          '#auraCopHead{cursor:default}' +
          '#auraCopAnswer{max-height:38vh}' +
          'button{font-family:inherit}';
        pipWin.document.head.appendChild(st);
        pipWin.document.body.appendChild(p);
        var restore = function(){
          try{ document.body.appendChild(p); p.style.display = 'none'; }catch(e){}
          pipWin = null;
          try{ copStatus(); }catch(e){}
        };
        pipWin.addEventListener('pagehide', restore);
        pipWin.addEventListener('beforeunload', restore);
        /* a float that silently does nothing is worse than a visible error, so the exact
           outcome is recorded on this origin for later inspection */
        try{
          localStorage.setItem('aura_pip_last', JSON.stringify({
            at: Date.now(), ok: true, mode: ('documentPictureInPicture' in window) ? 'document-pip' : 'popup',
            title: pipWin.document.title, bodyLen: pipWin.document.body.innerHTML.length,
            panelInside: !!pipWin.document.getElementById('auraCopPanel'),
            panelInMain: !!document.getElementById('auraCopPanel')
          }));
        }catch(e){}
        tell('Floating \u00b7 ' + ('documentPictureInPicture' in window ? 'always on top' : 'separate window') + ' \u2014 drag it over any app');
        copSyncMini(); copStatus();
      }catch(e){
        try{ localStorage.setItem('aura_pip_last', JSON.stringify({ at: Date.now(), ok: false, err: String((e && e.message) || e) })); }catch(x){}
        tell('Float failed: ' + (e && e.message || 'not allowed'));
      }
    }

    function copMinimise(){
      var p = panelEl; if(!p) return;
      p.style.display = 'none';
      copLauncher();
      copPill(true);
    }
    function copPanel(show){
      buildPanel();
      var p = panelEl;
      var want = (show === undefined) ? (p.style.display === 'none') : !!show;
      if(pipWin){ try{ if(want) pipWin.focus(); }catch(e){} return; }
      p.style.display = want ? 'block' : 'none';
      if(!want) return;
      var pos = copPosGet('aura_cop_pos');
      if(pos){ p.style.left = pos.l + 'px'; p.style.top = pos.t + 'px'; p.style.right = 'auto'; p.style.bottom = 'auto'; }
      else {
        var b = 96;
        try{
          var box = document.getElementById('card') || document.getElementById('inp');
          if(box){ var t = box.getBoundingClientRect().top; if(t > 40 && t < innerHeight - 30) b = Math.max(20, innerHeight - t + 12); }
        }catch(e){}
        p.style.right = '14px'; p.style.bottom = b + 'px'; p.style.left = 'auto'; p.style.top = 'auto';
      }
      copClamp(p);
      copSyncMini();
      copStatus();
      if(!co.on){ try{ p.querySelector('#auraCopQ').focus(); }catch(e){} }
    }
    /* the LIVE thumbnail is the proof the screen is really being seen */
    function copSyncMini(){
      var mini = document.getElementById('auraCopMini');
      var pv = document.getElementById('auraCopPrev');
      if(mini) mini.style.display = co.on ? 'block' : 'none';
      if(pv){
        try{
          if(co.on && co.stream){ if(pv.srcObject !== co.stream) pv.srcObject = co.stream; if(pv.play) pv.play().catch(function(){}); }
          else pv.srcObject = null;
        }catch(e){}
      }
      var tog = document.getElementById('auraCopToggle');
      if(tog){
        var canShare = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
        tog.textContent = co.on ? 'Stop screen share' : (canShare ? 'Start screen share' : 'Screen share is not supported here \u2014 use \ud83d\udcf7');
        tog.style.background = co.on ? 'rgba(255,90,90,.16)' : 'linear-gradient(135deg,#48c8ff,#2f7bff)';
        tog.style.color = co.on ? '#ffd7d7' : '#04121f';
        tog.style.borderColor = co.on ? 'rgba(255,120,120,.5)' : 'rgba(120,215,255,.45)';
      }
    }
    function copProgress(msg){
      if(!answerEl) return;
      answerEl.style.display = 'block';
      answerEl.textContent = (co.qline || '') + msg;
    }

    /* grab one frame right now (used by the Ask box, ignores the change gate) */
    function copNow(){
      var video = co.stream && co.stream.__video;
      if(!video || video.readyState < 2) return null;
      return copFrame(video);
    }

    /* ---------- reading the screen without a vision model ----------
       The free vision lanes run out of quota and then "screen reading is busy" is all
       the user ever gets. A browser can read its own frame, so the co-pilot falls back
       to: OCR the frame locally, then answer with the text brain. No quota, no upload,
       and it is the same text an error message is made of. */
    var ocrLib = null;
    function loadOCR(){
      if(window.Tesseract) return Promise.resolve(window.Tesseract);
      if(ocrLib) return ocrLib;
      ocrLib = new Promise(function(res, rej){
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
        s.onload = function(){ window.Tesseract ? res(window.Tesseract) : rej(new Error('ocr missing')); };
        s.onerror = function(){ ocrLib = null; rej(new Error('ocr load failed')); };
        document.head.appendChild(s);
      });
      return ocrLib;
    }
    async function copOCR(cv){
      try{
        var T = await loadOCR();
        var r = await T.recognize(cv, 'eng');
        var t = String((r && r.data && r.data.text) || '');
        return t.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
      }catch(e){ return ''; }
    }
    async function copAskText(screenText, question){
      try{
        var sys = 'You are AURA co-pilot looking at the user screen. Below is the TEXT read off that screen ' +
          '(OCR, may be messy). Answer the question from it in under 90 words, plain text, no markdown headers, ' +
          'no preamble. If the answer is not on the screen, say that in one line and give the most useful next step. ' +
          'Never repeat passwords, tokens or private messages you happen to read.';
        var r = await fetch(BASE + '/v1/chat/completions', {
          method: 'POST', headers: hdrs(),
          body: JSON.stringify({
            model: 'aura', stream: false,
            messages: [
              { role: 'system', content: sys },
              { role: 'user', content: 'SCREEN TEXT:\n' + String(screenText).slice(0, 3500) + '\n\nQUESTION: ' + question }
            ]
          }),
          signal: AbortSignal.timeout(50000)
        });
        if(!r.ok) return null;
        var j = await r.json();
        var t = String((((j.choices || [])[0] || {}).message || {}).content || '').trim();
        return t || null;
      }catch(e){ return null; }
    }

    /* ---------- photo path ----------
       Android and iOS browsers do not implement screen capture at all, so on a phone
       the co-pilot takes a photo or a screenshot instead and reads that. */
    function copFileInput(){
      var inp = document.getElementById("auraCopFile");
      if(!inp){
        inp = document.createElement("input");
        inp.type = "file"; inp.accept = "image/*"; inp.id = "auraCopFile";
        inp.setAttribute("capture", "environment");
        inp.style.cssText = "position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";
        document.body.appendChild(inp);
        inp.addEventListener("change", function(){
          var f = inp.files && inp.files[0];
          try{ inp.value = ""; }catch(e){}
          if(f) copAskPhoto(f);
        });
      }
      return inp;
    }
    function copPickPhoto(){
      try{ copFileInput().click(); }catch(e){ try{ tell("The photo picker did not open"); }catch(err){} }
    }
    function copPhotoCanvas(file){
      return new Promise(function(res){
        try{
          var img = new Image();
          var url = URL.createObjectURL(file);
          img.onload = function(){
            var k = Math.min(1, 1400 / Math.max(img.width, img.height));
            var w = Math.max(1, Math.round(img.width * k)), hh = Math.max(1, Math.round(img.height * k));
            var cv = document.createElement("canvas"); cv.width = w; cv.height = hh;
            cv.getContext("2d").drawImage(img, 0, 0, w, hh);
            try{ URL.revokeObjectURL(url); }catch(e){}
            res(cv);
          };
          img.onerror = function(){ try{ URL.revokeObjectURL(url); }catch(e){} res(null); };
          img.src = url;
        }catch(e){ res(null); }
      });
    }
    async function copAskPhoto(file){
      if(copAskPhoto.busy){ try{ tell('Still working on the previous photo'); }catch(e){} return; }
      copAskPhoto.busy = true;
      try{
      var q = (document.getElementById('auraCopQ').value || '').trim() || 'What is in this picture? Answer in 3 short lines.';
      var qline = 'Q: ' + q + '\n\n';
      co.qline = qline;
      copProgress(qline + 'Reading the photo\u2026');
      var cv = await copPhotoCanvas(file);
      if(!cv) return copAnswer(qline + 'That photo did not open — send it again.');
      var out = await copVision(cv, q);
      if(out){ copAnswer(qline + out.answer, out.model); if(copVoiceOn()) copSpeak(out.answer); return; }
      copProgress(qline + 'Reading the text\u2026');
      var text = await copOCR(cv);
      if(text && text.replace(/\s/g, '').length > 10){
        var ans = await copAskText(text, q);
        if(ans){ copAnswer(qline + ans, 'photo-text'); if(copVoiceOn()) copSpeak(ans); return; }
      }
      copAnswer(qline + 'Nothing readable in that photo. Zoom in or send a clearer shot.');
      } finally { copAskPhoto.busy = false; }
    }

    /* the image lane: unchanged behaviour, just split out so OCR can be the fallback */
    async function copVision(cv, question){
      try{
        var send = async function(){
          return await fetch(BASE + '/api/passive-vision', {
            method: 'POST', headers: hdrs(),
            body: JSON.stringify({ image: cv.toDataURL('image/jpeg', 0.62), question: question, mode: copMode(), context: copLogText() }),
            signal: AbortSignal.timeout(45000)
          });
        };
        var r = await send();
        if(r.status === 429){
          await new Promise(function(res){ setTimeout(res, 1400); });
          r = await send();
        }
        if(!r.ok) return null;
        var j = await r.json();
        if(j && j.action === 'ANSWER' && j.answer){
          co.asked = (co.asked || 0) + 1;
          co.log.push({ q: question, a: j.answer });
          if(co.log.length > 6) co.log.shift();
          copLogRender();
          copStatus();
          return j;
        }
      }catch(e){}
      return null;
    }

    async function copAsk(question){
      if(!co.on){
        await copStart();
        if(!co.on) return null;
      }
      /* the first frame arrives a moment after the share starts — wait for a real one
         instead of failing the question in the first 200ms */
      var cv = copNow();
      for(var i = 0; i < 30 && !cv; i++){
        await new Promise(function(res){ setTimeout(res, 200); });
        cv = copNow();
      }
      if(!cv) return null;
      copProgress((co.qline || '') + 'Looking at your screen\u2026');
      var out = await copVision(cv, question);
      if(out) return out;
      /* vision quota gone → read the words on the screen locally, answer with the text brain */
      copProgress((co.qline || '') + 'Reading the text on your screen\u2026');
      var text = await copOCR(cv);
      if(text && text.replace(/\s/g, '').length > 10){
        copProgress((co.qline || '') + 'Thinking about what it says\u2026');
        var ans = await copAskText(text, question);
        if(ans){
          co.asked = (co.asked || 0) + 1;
          co.log.push({ q: question, a: ans });
          if(co.log.length > 6) co.log.shift();
          copLogRender();
          copStatus();
          return { action: 'ANSWER', answer: ans, model: 'screen-text' };
        }
      }
      return null;
    }

    window.__auraCopilot = {
      on: function(){ return co.on; },
      toggle: function(){ co.on ? copStop() : copStart(); copStatus(); },
      panel: function(show){ copPanel(show); },
      ask: function(q){ return copAsk(q); },
      /* exposed so the screen reader can be checked without a vision model */
      ocr: function(){ var cv = copNow(); return cv ? copOCR(cv) : Promise.resolve(''); },
      pos: function(){ var p = document.getElementById('auraCopPanel'); if(!p) return null; var r = p.getBoundingClientRect(); return { l: Math.round(r.left), t: Math.round(r.top) }; },
      status: function(){ return { on: co.on, sent: co.sent, skipped: co.skipped, asked: co.asked || 0 }; },
      stats: function(){ return { on: co.on, sent: co.sent, skipped: co.skipped }; },
      suggest: function(fix, line){ copPulse(); if(line) copSay(line); copShow(fix); }
    };

    /* menu entry, next to Attach */
    setTimeout(function(){
      var tools = document.getElementById('tools');
      if(!tools || document.getElementById('auraCopBtn')) return;
      var b = document.createElement('button');
      b.id = 'auraCopBtn';
      b.type = 'button';
      b.textContent = '\uD83D\uDC41 Co-Pilot';
      b.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:9px;' +
        'border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);color:#cfcdcb;' +
        "font:12.5px/1.4 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;cursor:pointer;user-select:none";
      b.onclick = function(e){ e.stopPropagation(); try{ closeMenus(); }catch(err){} window.__auraCopilot.panel(true); };
      tools.appendChild(b);
    }, 1200);
    /* the orb is the way in — present on every page load, draggable, never hidden */
    setTimeout(function(){ try{ copLauncher(); }catch(e){} }, 900);
  }catch(e){}

  /* ---------------- SIGN LANGUAGE MODE (16 Nov) ----------------
     A deaf user signs to the camera; AURA reads the frame, writes it big and speaks it
     out loud so a hearing person understands. The same window takes typed text and the
     other person's speech back as big readable text, and the whole conversation is
     saved into Chats. */
  try{
    (function signMode(){
      var S = { on: false, stream: null, timer: null, prev: null, log: [], speak: true, last: '', lastTs: 0, busy: false, mic: null };
      function el(id){ return document.getElementById(id); }
      function big(t, sub){
        var b = el('asgBig');
        if(b) b.textContent = t;
        var s = el('asgSub');
        if(s) s.textContent = sub || '';
      }
      function push(who, text){
        text = String(text || '').trim();
        if(!text) return;
        S.log.push({ who: who, text: text, ts: Date.now() });
        if(S.log.length > 300) S.log.shift();
        var box = el('asgLog');
        if(box){
          var line = document.createElement('div');
          line.style.cssText = 'padding:6px 0;border-top:1px solid rgba(255,255,255,.06)';
          line.innerHTML = '<b style="color:' + (who === 'me' ? '#9fd8ff' : '#7ff0b4') + '">' +
            (who === 'me' ? 'Sign' : 'AURA') + ':</b> ' +
            String(text).replace(/[<>&]/g, '');
          box.appendChild(line);
          box.scrollTop = box.scrollHeight;
        }
      }
      function say(text){
        try{
          if(auraMuted() || !S.speak || !window.speechSynthesis) return;
          var s = String(text || '').replace(/[*_`#]/g, '').trim();
          if(!s) return;
          var u = new SpeechSynthesisUtterance(s.slice(0, 300));
          u.rate = 1.0; u.pitch = 1;
          u.lang = /[\u0900-\u097F]/.test(s) ? 'hi-IN' : 'en-US';
          speechSynthesis.cancel(); speechSynthesis.speak(u);
        }catch(e){}
      }
      function frame(video){
        var vw = video.videoWidth || 0, vh = video.videoHeight || 0;
        if(!vw || !vh) return null;
        var k = Math.min(1, 900 / Math.max(vw, vh));
        var cv = document.createElement('canvas');
        cv.width = Math.round(vw * k); cv.height = Math.round(vh * k);
        try{ cv.getContext('2d').drawImage(video, 0, 0, cv.width, cv.height); }catch(e){ return null; }
        return cv;
      }
      function sig(cv){
        var s = document.createElement('canvas'); s.width = 48; s.height = 27;
        var c = s.getContext('2d');
        c.drawImage(cv, 0, 0, 48, 27);
        var d = c.getImageData(0, 0, 48, 27).data, out = new Uint8Array(48 * 27);
        for(var i = 0, p = 0; i < d.length; i += 4, p++) out[p] = (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11) | 0;
        return out;
      }
      function changed(a, b){
        if(!a || !b) return true;
        var n = 0;
        for(var i = 0; i < a.length; i++) if(Math.abs(a[i] - b[i]) > 12) n++;
        return n / a.length > 0.06;
      }
      function taught(){
        try{ return JSON.parse(localStorage.getItem("aura_sign_teach_v1") || "[]"); }catch(e){ return []; }
      }
      async function readSign(cv){
        try{
          var r = await fetch(BASE + '/v1/sign', {
            method: 'POST', headers: hdrs(),
            body: JSON.stringify({
              image: cv.toDataURL('image/jpeg', 0.72),
              history: S.log.slice(-3).map(function(e){ return e.text; }).join(" | ").slice(0, 240),
              vocab: taught().map(function(x){ return x.label; })
            }),
            signal: AbortSignal.timeout(35000)
          });
          if(!r.ok) return null;
          return await r.json();
        }catch(e){ return null; }
      }
      async function tick(){
        if(!S.on || S.busy) return;
        var v = el('asgVideo');
        if(!v || v.readyState < 2) return;
        var cv = frame(v);
        if(!cv) return;
        var sg = sig(cv);
        if(S.prev && !changed(S.prev, sg)) return;
        S.prev = sg;
        S.busy = true;
        try{
          var j = await readSign(cv);
          if(j && j.ok && (j.sign || j.speech)){
            var key = (j.sign || '') + '|' + (j.speech || '');
            if(key === S.last && Date.now() - S.lastTs < 6000) return;

        mic.style.borderColor = on ? 'rgba(120,215,255,.7)' : '';
      }
      if(!SR){
        mic.addEventListener('click', function(e){
          e.preventDefault(); e.stopImmediatePropagation();
          tell('This browser has no voice input — type instead');
        }, true);
        return;
      }
      var rec = null, listening = false, said = '', sendTimer = null;
      function sendNow(){
        clearTimeout(sendTimer);
        var t = String(inpEl.value || '').trim();
        hide();
        if(t.length < 2){ tell('I did not catch that — say it again'); return; }
        if(window.__auraIntent && window.__auraIntent(t)){ try{ inpEl.value = ''; }catch(e){} return; }
        sendBtn.click();
      }
      function stop(){
        listening = false; mark(false);
        try{ if(rec) rec.stop(); }catch(e){}
      }
      function start(){
        rec = new SR();
        rec.lang = /hinglish|hi/i.test(String(localStorage.getItem('az.lang') || '')) ? 'hi-IN' : 'en-IN';
        rec.continuous = false;
        rec.interimResults = true;
        rec.maxAlternatives = 1;
        said = '';
        rec.onstart = function(){ listening = true; mark(true); show('\uD83C\uDFA4 Listening\u2026', true); };
        rec.onresult = function(ev){
          var interim = '';
          for(var i = ev.resultIndex; i < ev.results.length; i++){
            var r = ev.results[i];
            if(r.isFinal) said += r[0].transcript;
            else interim += r[0].transcript;
          }
          var live = (said + ' ' + interim).trim();
          if(live){ show('\uD83C\uDFA4 ' + live, true); }
          clearTimeout(sendTimer);
          /* a natural pause ends the turn — no extra tap needed */
          sendTimer = setTimeout(function(){ stop(); inpEl.value = (said || live).trim(); sendNow(); }, 1400);
        };
        rec.onerror = function(e){
          listening = false; mark(false); hide();
          var why = (e && e.error) || '';
          if(/not-allowed|service-not-allowed/.test(why)) tell('Allow microphone access in browser settings');
          else if(/no-speech/.test(why)) tell('I did not catch that — say it again');
          else if(/network/.test(why)) tell('Voice input needs a connection');
          else tell('Voice input did not start — type instead');
        };
        rec.onend = function(){
          mark(false); listening = false;
          if(String(inpEl.value || '').trim().length > 1){ hide(); return; }
          if(said.trim().length > 1){ inpEl.value = said.trim(); sendNow(); }
          else hide();
        };
        try{ rec.start(); }catch(e){ hide(); tell('The mic did not start — tap it again'); }
        /* if the engine never answers, the tap must not look dead — the usual reason is
           the permission prompt still waiting on screen */
        clearTimeout(start.watch);
        start.watch = setTimeout(function(){
          if(listening) return;
          tell('No response from the mic — press Allow in the browser, then tap the mic again');
        }, 6000);
      }
      var onMic = function(e){
        if(e){ try{ e.preventDefault(); e.stopImmediatePropagation(); }catch(err){} }
        clearTimeout(sendTimer);
        if(listening || pill.style.display === 'flex'){ stop(); hide(); return; }
        start();
      };
      mic.addEventListener('click', onMic, true);
      /* the reference page also owns `onclick` on this button; a property assignment is
         the only way to guarantee ours is the handler that really runs */
      try{ mic.onclick = onMic; }catch(e){}
      window.__auraVoiceReady = true;
      window.__auraVoice = { on: function(){ return listening; }, start: start, stop: stop };

      /* the same orders work when typed — otherwise "open youtube" became a chat message */
      sendBtn.addEventListener('click', function(e){
        var t = String(inpEl.value || '').trim();
        if(!t) return;
        if(window.__auraIntent && window.__auraIntent(t)){
          e.preventDefault(); e.stopImmediatePropagation();
          try{ inpEl.value = ''; }catch(err){}
        }
      }, true);

      /* after Send, say what is happening instead of leaving a dead screen */
      sendBtn.addEventListener('click', function(){
        var base = document.querySelectorAll('#msgs .m').length;
        /* a photo goes through the vision lane, which takes longer than text — say so */
        var hadImage = !!document.querySelector('#auraFiles img');
        setTimeout(function(){
          if(document.querySelectorAll('#msgs .m').length > base) return;  /* already answered */
          show(hadImage ? '\uD83D\uDCF7 Reading the photo\u2026' : '\u26A1 Thinking\u2026', false);
          var iv = setInterval(function(){
            /* the reply adds one bubble; anything beyond the user's own line ends it */
            if(document.querySelectorAll('#msgs .m').length > base + 1){ clearInterval(iv); hide(); }
          }, 400);
          setTimeout(function(){ clearInterval(iv); hide(); }, 45000);
        }, 2200);
      }, true);
    })();
  }catch(e){}

  /* ---------------- NOTHING STAYS TRANSPARENT ----------------
     Several blocks enter with a fade animation that starts at opacity:0. If the
     animation is throttled (hidden tab), disabled (battery saver / reduced motion)
     or interrupted, the block is present but invisible. This watches the few
     blocks that matter and releases them if the fade never arrived. */
  try{
    function unfreeze(){
      ['.panel.on', '#wel', '.card', '.dockw'].forEach(function(sel){
        var el = document.querySelector(sel);
        if(!el) return;
        var o = parseFloat(getComputedStyle(el).opacity);
        if(!(o > 0.05)){
          el.style.animation = 'none';
          el.style.opacity = '1';
          el.style.transform = 'none';
        }
      });
    }
    window.__auraUnfreeze = unfreeze;
    setTimeout(unfreeze, 900);
    setTimeout(unfreeze, 2200);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) setTimeout(unfreeze, 100); });
    document.addEventListener('click', function(e){
      var b = e.target && e.target.closest ? e.target.closest('#tabs button') : null;
      if(b) setTimeout(unfreeze, 700);
    }, true);
  }catch(e){}

  /* ---------------- PANELS MUST NEVER BE BLANK ----------------
     The three data panels (Chats list, System rail/log/memory, Admin squad) are filled
     by the reference's own render functions. One throw — a saved chat with an odd
     shape, a missing element — leaves an empty panel that looks "not working". Each
     renderer is re-run defensively and a readable fallback is written if it still
     comes back empty. */
  try{
    function fillOnce(){
      function empty(el){ return el && (el.innerText || '').trim().length === 0; }

      }

    document.addEventListener('click', function(e){

  /* ---------------- ADMIN IS INVISIBLE UNTIL GOOGLE SIGN-IN ----------------
     Nobody sees the Admin tab, its panel, or any hint that it exists. The only
     way in is a staff Google account whose role the backend confirms (maker/ceo).
     Hidden entry: Ctrl+Shift+A, "?admin=1", or five quick taps on the brand. */
  try{
    var adminTab = document.querySelector('#tabs button[data-p="admin"]');
    var adminPanel = document.getElementById('p-admin');
    var ADMIN_KEY = 'aura_admin_session';

    var adminNav = adminTab ? adminTab.parentNode : null;
    var adminStage = adminPanel ? adminPanel.parentNode : null;
    function adminHide(){
      /* taken out of the DOM, not just hidden — nothing in devtools hints at it */
      if(adminPanel && adminPanel.classList.contains('on')){ var c = document.querySelector('#tabs button[data-p="chat"]'); if(c) c.click(); }
      if(adminTab && adminTab.parentNode) adminTab.parentNode.removeChild(adminTab);
      if(adminPanel && adminPanel.parentNode) adminPanel.parentNode.removeChild(adminPanel);
    }
    function adminShow(){
      if(adminTab && adminNav && !adminTab.parentNode) adminNav.appendChild(adminTab);
      if(adminPanel && adminStage && !adminPanel.parentNode) adminStage.appendChild(adminPanel);
    }
    function adminSession(){
      try{ var s = JSON.parse(localStorage.getItem(ADMIN_KEY) || 'null'); if(s && s.exp > Date.now()) return s; }catch(e){}
      return null;
    }
    function adminSignOut(){
      try{ localStorage.removeItem(ADMIN_KEY); }catch(e){}
      adminHide();
      if(window.__auraAdminApp){ try{ window.__auraAdminApp.auth().signOut(); }catch(e){} }
    }
    function loadScript(src){
      return new Promise(function(ok, no){
        var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s);
      });
    }
    function adminSheet(msg){
      var old = document.getElementById('auraAdminSheet');
      if(old) old.parentNode.removeChild(old);
      var d = document.createElement('div');
      d.id = 'auraAdminSheet';
      d.style.cssText = 'position:fixed;inset:0;z-index:100001;background:rgba(3,6,12,.72);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px';
      d.innerHTML =
        '<div style="width:min(380px,100%);background:rgba(10,14,22,.97);border:1px solid rgba(120,215,255,.22);border-radius:18px;padding:22px;color:#e8f4ff;font:14px/1.6 Inter,system-ui,sans-serif">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
            '<b style="font-size:15px">Staff access</b>' +
            '<button type="button" id="auraAdminX" style="background:none;border:0;color:#7f8b9a;font-size:16px;cursor:pointer">\u2715</button></div>' +
          '<p style="color:#b9c6d4;margin:0 0 14px" id="auraAdminMsg">' + (msg || 'Sign in with the owner Google account to open the admin console.') + '</p>' +
          '<button type="button" id="auraAdminGoogle" style="width:100%;padding:11px 14px;border-radius:11px;border:1px solid rgba(120,215,255,.35);background:rgba(120,215,255,.14);color:#dff4ff;font:600 13.5px Inter,system-ui,sans-serif;cursor:pointer">Continue with Google</button>' +

        var btn = this, m = document.getElementById('auraAdminMsg');
        btn.disabled = true; btn.textContent = 'Checking\u2026';
        try{
          var cfg = null;
          try{
            var h = await fetch(BASE + '/health', { cache: 'no-store' });
            var hj = await h.json();
            cfg = hj.firebaseWebConfig || null;
          }catch(e){}
          if(!cfg || !cfg.apiKey){
            m.textContent = 'Google sign-in is not configured yet \u2014 the owner must add Firebase web config on the server.';

          }
          try{ await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'); }catch(e){}

          window.__auraAdminApp = app;
          var provider = new firebase.auth.GoogleAuthProvider();
          var cred = await app.auth().signInWithPopup(provider);
          var tok = await cred.user.getIdToken();
          var me = await fetch(BASE + '/v1/me', { headers: Object.assign({ Authorization: 'Bearer ' + tok }, hdrs()) });
          if(!me.ok) throw new Error('session not accepted');
          var u = await me.json();
          if(!/^(maker|ceo|admin|owner)$/i.test(u.role || '')){
            try{ await app.auth().signOut(); }catch(e){}

  /* ---------------- THE CORE -------------
     A live 3D particle nucleus that stays on screen while you chat: it turns,
     breathes with the microphone, fires a shockwave when a message leaves or
     arrives, and pulses with the voice while AURA speaks. Pure canvas 2D, no libs. */
  try{
    (function core(){
      var host = document.getElementById('auraCoreWrap');

          '-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 38%,rgba(0,0,0,0) 68%);' +

        state: function(){ return { ex: ex, amp: amp }; },
        excite: function(k){ ex = Math.min(2.6, ex + (k == null ? 1 : k)); },

      try{
        if(window.speechSynthesis){

          speechSynthesis.addEventListener('boundary', function(){ window.AURA_CORE.excite(0.35); });

        if(document.hidden && window.__auraCorePainted) return;

          var z2 = by * sinX + z1 * cosX;
          var persp = 2.9 / (2.9 + z2);
          proj.push({ x: cx + x1 * R * persp, y: cy + y1 * R * persp, z: z2, s: p.s * persp * dpr, hot: p.hot });
        }
        proj.sort(function(a, b){ return a.z - b.z; });

        /* orbital rings */
        for(var ring = 0; ring < 2; ring++){
          ctx.beginPath();
          var rr = R * (1.18 + ring * 0.22);
          var tilt = 0.34 + ring * 0.1;
          for(var a = 0; a <= 64; a++){
            var ang = (a / 64) * Math.PI * 2 + rotY * (ring ? -0.6 : 1) + phase * 0.2;
            var px = Math.cos(ang) * rr;
            var pz = Math.sin(ang) * rr;
            var py = Math.sin(ang) * rr * tilt;
            var persp2 = 2.9 / (2.9 + pz / R);
            var X = cx + px * persp2, Y = cy + py * persp2;
            if(a === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
          }
          ctx.strokeStyle = 'rgba(120,215,255,' + (0.06 + ex * 0.05 + ring * 0.02) + ')';
          ctx.lineWidth = 1 * dpr;
          ctx.stroke();
        }

        /* particles */
        for(var k = 0; k < proj.length; k++){
          var q = proj[k];
          var alpha = 0.16 + (1 - (q.z + 1) / 2) * 0.66 + ex * 0.12;
          ctx.beginPath();
          ctx.arc(q.x, q.y, Math.max(0.4, q.s), 0, Math.PI * 2);
          ctx.fillStyle = q.hot
            ? 'rgba(150,240,255,' + Math.min(1, alpha + 0.2) + ')'
            : 'rgba(120,200,255,' + alpha + ')';
          ctx.fill();
        }

        /* nucleus glow */
        var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.9);
        g.addColorStop(0, 'rgba(160,235,255,' + (0.1 + amp * 0.3 + ex * 0.12) + ')');
        g.addColorStop(0.55, 'rgba(90,170,255,0.05)');
        g.addColorStop(1, 'rgba(90,170,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, R * 0.95, 0, Math.PI * 2); ctx.fill();

        /* shockwave on a message / voice burst */
        if(ex > 0.35){
          ctx.beginPath();
          ctx.arc(cx, cy, R * (1.05 + (2.4 - ex) * 0.2), 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(150,240,255,' + Math.min(0.5, ex * 0.22) + ')';
          ctx.lineWidth = 1.6 * dpr;
          ctx.stroke();
        }
      }
      requestAnimationFrame(frame);
      setTimeout(function(){ try{ frame(performance.now(), true); }catch(e){} }, 800);

      /* keep the core out of the way on narrow screens */
      function layout(){
        if(window.innerWidth < 720){
          /* phones: a small faint nucleus below the header — decoration, never a
             block on top of the tabs or the message text */
          var hb = 150;
          try{ var hd = document.querySelector('header.top'); if(hd) hb = hd.getBoundingClientRect().bottom; }catch(e){}
          host.style.width = '96px'; host.style.height = '96px';
          host.style.right = '8px'; host.style.top = (hb + 10) + 'px'; host.style.transform = 'none';
          host.style.opacity = '.28'; host.style.zIndex = '0';
        }else if(window.innerWidth < 1280){
          /* narrower laptops: keep it out of the reading column */
          host.style.width = '190px'; host.style.height = '190px';
          host.style.right = '12px'; host.style.top = '50%'; host.style.transform = 'translateY(-50%)'; host.style.opacity = '.5';
        }else{
          host.style.width = 'clamp(200px,22vw,340px)'; host.style.height = 'clamp(200px,22vw,340px)';
          host.style.right = '2.2vw'; host.style.top = '50%'; host.style.transform = 'translateY(-50%)'; host.style.opacity = '.9';
        }
        resize();
      }
      layout();
      window.addEventListener('resize', layout);
    })();
  }catch(e){}

  /* ---------------- AURA IRIS — replaces the spinning ball on the welcome screen ----
     A solid orb reads as a generic sphere and fights the interface's thin hairlines.
     This is an iris: a vertical lens of light held inside three tilted rings with a
     slow dust veil. Same slot as the old orb, same reactions (mic, typing, message). */
  try{
    (function iris(){
      var wrap = document.getElementById('coreStageWrap');
      if(!wrap){ setTimeout(iris, 150); return; }
      var old = document.getElementById('coreCanvas');
      if(old) old.style.opacity = '0';
      var cv = document.getElementById('auraIris');
      if(!cv){
        cv = document.createElement('canvas');
        cv.id = 'auraIris';
        cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 0 26px rgba(120,215,255,.35));' +
          '-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 42%,rgba(0,0,0,0) 72%);' +
          'mask-image:radial-gradient(circle at 50% 50%,#000 42%,rgba(0,0,0,0) 72%)';
        wrap.appendChild(cv);
      }
      var ctx = cv.getContext('2d');
      /* the reference draws a dark card behind the core; with the new bloom that card
         shows up as a grey square around the light. On a phone the orb sits on the
         page itself. */
      try{
        if(window.innerWidth < 900){
          if(wrap.parentElement) wrap.parentElement.style.background = 'transparent';
          [].forEach.call(wrap.children, function(ch){
            if(ch.tagName === 'DIV'){ ch.style.background = 'transparent'; ch.style.boxShadow = 'none'; }
          });
        }
      }catch(e){}
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var dust = [], N = (window.innerWidth < 520 ? 64 : 110);
      for(var i = 0; i < N; i++){
        dust.push({ a: Math.random() * Math.PI * 2, r: 0.62 + Math.random() * 0.5, sp: 0.15 + Math.random() * 0.5, s: 0.5 + Math.random() * 1.1, w: Math.random() * 6.28 });
      }
      var t = 0, ex = 0, amp = 0, painted = 0;

      function size(){
        var b = wrap.getBoundingClientRect();
        var nw = Math.max(1, Math.round(b.width * dpr));
        var nh = Math.max(1, Math.round(b.height * dpr));
        if(nw !== cv.width || nh !== cv.height){ cv.width = nw; cv.height = nh; }
      }
      size();
      window.addEventListener('resize', size);
      if(old){ old.width = 8; old.height = 8; }   /* the hidden orb stops costing a full-size canvas */

      function level(){
        try{
          if(window.AURA_CORE && window.AURA_CORE.state){
            var s = window.AURA_CORE.state();
            ex = Math.max(ex, s.ex || 0);
            amp = Math.max(amp, s.amp || 0);
          }
        }catch(e){}
      }

      function draw(dt, once){
        level();
        /* the welcome block is laid out after this script runs, so the canvas was
           being sized at 0×0 and stayed a 1 px invisible dot — re-measure here */
        if(cv.width < 12 || cv.height < 12) size();
        t += dt * 0.001;
        var w = cv.width, h = cv.height, cx = w / 2, cy = h / 2;
        var R = Math.min(w, h) * 0.37 * (1 + ex * 0.04 + amp * 0.22);
        ctx.clearRect(0, 0, w, h);

        /* ---- the light the core throws on the dark ---- */
        /* the glow must reach zero by the canvas edge, otherwise the clip draws a
           visible square around the light */
        var maxR = Math.min(w, h) / 2;
        var bloom = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
        bloom.addColorStop(0, 'rgba(130,225,255,' + (0.20 + amp * 0.22 + ex * 0.10).toFixed(3) + ')');
        bloom.addColorStop(0.42, 'rgba(95,150,255,0.075)');
        bloom.addColorStop(0.76, 'rgba(140,110,255,0.025)');
        bloom.addColorStop(1, 'rgba(90,120,255,0)');
        ctx.fillStyle = bloom;
        ctx.beginPath(); ctx.arc(cx, cy, maxR, 0, Math.PI * 2); ctx.fill();

        /* ---- dust: a tilted veil, two temperatures, each mote twinkling ---- */
        for(var i = 0; i < dust.length; i++){
          var p = dust[i];
          var a = p.a + t * p.sp;
          var wob = Math.sin(t * 1.6 + p.w) * 0.03;
          var rr = R * (p.r + wob + ex * 0.05);
          var z = Math.sin(a) * rr;
          var x = Math.cos(a) * rr;
          var y = z * 0.30;
          var per = 2.6 / (2.6 + z / R);
          var tw = 0.55 + 0.45 * Math.sin(t * 2.1 + p.w * 4);
          var alpha = (0.09 + (z < 0 ? 0.32 : 0.05) + amp * 0.10) * tw;
          ctx.beginPath();
          ctx.arc(cx + x * per, cy + y * per, Math.max(0.35, p.s * per * dpr * 0.7), 0, Math.PI * 2);
          ctx.fillStyle = (i % 6 === 0 ? 'rgba(186,170,255,' : 'rgba(150,225,255,') + Math.min(0.85, alpha).toFixed(3) + ')';
          ctx.fill();
        }

        /* ---- hair-thin filaments reaching from the outer ring to the core ---- */
        var spokes = 7;
        for(var f = 0; f < spokes; f++){
          var fa = t * 0.22 + f * (Math.PI * 2 / spokes);
          var fr = R * 0.98;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.quadraticCurveTo(
            cx + Math.cos(fa) * fr * 0.45, cy + Math.sin(fa) * fr * 0.16,
            cx + Math.cos(fa) * fr, cy + Math.sin(fa) * fr * 0.42
          );
          ctx.strokeStyle = 'rgba(120,210,255,' + (0.035 + ex * 0.05 + amp * 0.03).toFixed(3) + ')';
          ctx.lineWidth = 0.7 * dpr;
          ctx.stroke();
        }

        /* ---- three tilted rings, alternating cyan and violet ---- */
        for(var k = 0; k < 3; k++){
          var rx = R * (0.60 + k * 0.17);
          var ry = rx * (0.20 + k * 0.055);
          var rot = t * (0.28 + k * 0.16) * (k % 2 ? -1 : 1);
          var tint = k === 1 ? 'rgba(182,164,255,' : 'rgba(130,220,255,';
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(-0.42 + k * 0.42 + rot * 0.25);
          for(var seg = 0; seg < 2; seg++){
            ctx.beginPath();
            ctx.ellipse(0, 0, rx, ry, 0, seg * Math.PI + rot, seg * Math.PI + rot + Math.PI * 0.86);
            ctx.strokeStyle = tint + (0.10 + k * 0.05 + ex * 0.05).toFixed(3) + ')';
            ctx.lineWidth = (0.8 + (2 - k) * 0.35) * dpr;
            ctx.stroke();
          }
          /* one bright arc that travels around the ring */
          var ha = rot * 1.7;
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, ha, ha + 0.55);
          ctx.strokeStyle = 'rgba(235,250,255,' + (0.38 + ex * 0.25).toFixed(3) + ')';
          ctx.lineWidth = 1.5 * dpr;
          ctx.stroke();
          ctx.restore();
        }

        /* ---- the iris: a wide aura, a bright lens, a white heart ---- */
        var ih = R * 1.52 * (1 + ex * 0.02 + amp * 0.06);
        var iw = R * 0.30 * (1 + ex * 0.10 + amp * 0.35);
        function lensPath(ww, hh){
          ctx.beginPath();
          ctx.moveTo(cx, cy - hh / 2);
          ctx.bezierCurveTo(cx + ww, cy - hh * 0.18, cx + ww, cy + hh * 0.18, cx, cy + hh / 2);
          ctx.bezierCurveTo(cx - ww, cy + hh * 0.18, cx - ww, cy - hh * 0.18, cx, cy - hh / 2);
          ctx.closePath();
        }
        lensPath(iw * 2.3, ih);
        var auraG = ctx.createLinearGradient(cx, cy - ih / 2, cx, cy + ih / 2);
        auraG.addColorStop(0, 'rgba(140,220,255,0)');
        auraG.addColorStop(0.45, 'rgba(150,225,255,' + (0.15 + amp * 0.16 + ex * 0.05).toFixed(3) + ')');
        auraG.addColorStop(0.55, 'rgba(140,200,255,' + (0.15 + amp * 0.16 + ex * 0.05).toFixed(3) + ')');
        auraG.addColorStop(1, 'rgba(140,220,255,0)');
        ctx.fillStyle = auraG;
        ctx.fill();

        lensPath(iw, ih);
        var g = ctx.createLinearGradient(cx, cy - ih / 2, cx, cy + ih / 2);
        g.addColorStop(0, 'rgba(190,245,255,0)');
        g.addColorStop(0.26, 'rgba(150,235,255,' + (0.50 + amp * 0.20).toFixed(3) + ')');
        g.addColorStop(0.48, 'rgba(245,253,255,0.96)');
        g.addColorStop(0.54, 'rgba(226,250,255,0.98)');
        g.addColorStop(0.68, 'rgba(150,220,255,0.75)');
        g.addColorStop(0.88, 'rgba(150,160,255,0.22)');
        g.addColorStop(1, 'rgba(150,160,255,0)');
        ctx.fillStyle = g;
        ctx.shadowColor = 'rgba(140,225,255,' + (0.75 + amp * 0.2).toFixed(2) + ')';
        ctx.shadowBlur = 28 * dpr;
        ctx.fill();
        ctx.shadowBlur = 0;

        /* the heart of the lens */
        var sparkR = R * 0.20 * (1 + amp * 0.45 + ex * 0.10);
        var spark = ctx.createRadialGradient(cx, cy, 0, cx, cy, sparkR);
        spark.addColorStop(0, 'rgba(255,255,255,0.95)');
        spark.addColorStop(0.32, 'rgba(198,245,255,0.55)');
        spark.addColorStop(1, 'rgba(120,200,255,0)');
        ctx.fillStyle = spark;
        ctx.beginPath(); ctx.arc(cx, cy, sparkR, 0, Math.PI * 2); ctx.fill();

        /* specular hairline so the lens reads as glass, not a glowing blob */
        ctx.beginPath();
        ctx.moveTo(cx - iw * 0.30, cy - ih * 0.26);
        ctx.quadraticCurveTo(cx - iw * 0.62, cy, cx - iw * 0.30, cy + ih * 0.26);
        ctx.strokeStyle = 'rgba(255,255,255,0.30)';
        ctx.lineWidth = 1.1 * dpr;
        ctx.stroke();

        /* a breath on every message / voiced word */
        if(ex > 0.3){
          for(var pr = 0; pr < 2; pr++){
            var rp = R * (0.72 + (2.4 - ex) * 0.40 + pr * 0.16);
            ctx.beginPath();
            ctx.ellipse(cx, cy, rp, rp * 0.42, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(190,240,255,' + Math.min(0.40, ex * 0.20 / (pr + 1)).toFixed(3) + ')';
            ctx.lineWidth = (1.4 - pr * 0.4) * dpr;
            ctx.stroke();
          }
        }
        ex *= 0.94; amp *= 0.94;

        painted = 1;
      }

      var last = performance.now();
      function loop(now){
        requestAnimationFrame(loop);
        if(document.hidden && painted) return;
        /* the welcome block disappears once a chat starts — no reason to keep
           painting 110 particles behind a panel nobody is looking at */
        var wel = document.getElementById('wel');
        if(wel && (wel.offsetParent === null || getComputedStyle(wel).display === 'none')){ painted = 1; last = now; return; }
        var dt = Math.min(60, now - last);
        last = now;
        try{ draw(dt); }catch(e){}
      }
      requestAnimationFrame(loop);
      setTimeout(function(){ try{ draw(16); }catch(e){} }, 350);
    })();
  }catch(e){}

  /* the floating core is a chat-time companion only — the welcome screen has the iris */
  try{
    (function floatOnlyInChat(){
      var host = document.getElementById('auraCoreWrap');
      var chatw = document.getElementById('chatw');
      if(!host || !chatw) return;
      function sync(){
        var inChat = chatw.classList.contains('has');
        host.style.display = (!inChat && window.innerWidth >= 900) ? 'none' : '';
        if(!inChat && window.innerWidth < 900) host.style.display = 'none';
      }
      sync();
      new MutationObserver(sync).observe(chatw, { attributes: true, attributeFilter: ['class'] });
      window.addEventListener('resize', sync);
    })();
  }catch(e){}

  /* a hosted mesh keeps listening in the background */
  try{ if(mesh.code) setTimeout(pollStart, 1200); }catch(e){}
})();
</script>

<script>
/* ================= AURA VOICE (wake word) =================
   Not a mode and not a switch you hunt for: once the mic has been allowed, AURA keeps
   a light ear open and wakes on the word "Aura" / "hey Aura", exactly like Siri. The
   wake listen is free — only a recognised "Aura" starts a command, so it does not
   chatter. Every command it can do offline (time, maths, timer, alarm, note, call,
   message, music) runs with no network; questions go to the brain and are spoken back.
   A browser cannot run while the phone is locked — that is the one Siri thing a web
   page is not allowed to do. */
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var V = window.__auraVoice = { armed:false, awake:false, rec:null, timer:null, expect:false, denied:false, silent:false, heard:"" };
  var NOTES = "aura_notes_v1";
  var WAKE = /(^|[\s,.])(hey\s+)?(aura|ओरा)([\s,.!?]|$)/i;

  /* ---------- small UI: one quiet chip above the composer ---------- */
  var chip;
  function ui(state, text){
    if(P && P.open){ if(chip) chip.style.display = "none"; return; }
    if(!chip){
      chip = document.createElement("div"); chip.id = "auraWakeChip";
      chip.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:88;display:none;" +
        "align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:rgba(8,16,26,.86);" +
        "border:1px solid rgba(120,215,255,.22);color:#bfe3ff;font:11.5px/1 Inter,system-ui,sans-serif;" +
        "white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.35);backdrop-filter:blur(8px);max-width:88vw;" +
        "overflow:hidden;text-overflow:ellipsis;transition:opacity .18s ease";

      window.addEventListener("resize", function(){ if(chip.style.display !== "none") place(); });
    }
    place();
    if(!state){ chip.style.display = "none"; return; }
    chip.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:' +
      (state === "awake" ? "#5cf0a8" : state === "off" ? "#ff8f8f" : "#48c8ff") +
      ';box-shadow:0 0 8px ' + (state === "awake" ? "#5cf0a8" : "#48c8ff") + '"></span>' +
      '<span>' + text + '</span>';
    chip.style.display = "inline-flex";
  }
  /* sit just above the composer card whatever its height is */
  function place(){
    try{
      var card = document.getElementById("card") || document.querySelector(".crow");
      if(!card) return;
      var r = card.getBoundingClientRect();
      chip.style.bottom = Math.max(14, window.innerHeight - r.top + 10) + "px";

  }
  function flash(text, ms){ ui("awake", text); clearTimeout(flash.h); flash.h = setTimeout(function(){ if(!V.awake) idle(); }, ms || 2600); }

  /* ================= SIRI SHEET =================
     The wake word alone was invisible: you spoke and nothing on screen moved, so a
     working ear read as a broken feature. This sheet is the face of the same ear — the
     orb, the live transcript, the answer, a Talk button that works without the wake
     word, a typed fallback when the browser has no SpeechRecognition, and Esc to leave.
     It also fixes the two things that made hands-free unreliable: the recogniser was
     restarted while AURA was still speaking (so she heard her own voice and looped),
     and every restart retried at a flat 1.5s with no backoff. */
  var P = { open:false, listening:false, last:"" };
  window.__auraSiriState = P;
  var siriOv = null, siriRec = null, siriSilence = null;
  var SIRI_LBL = { idle:"AURA", listening:"LISTENING", thinking:"THINKING", speaking:"SPEAKING", ready:"READY", error:"TRY AGAIN" };

  function siriBuilt(){
    if(siriOv) return siriOv;
    var st = document.createElement("style");
    st.id = "auraSiriCss";
    st.textContent =
      "#auraSiriOv{position:fixed;inset:0;z-index:130;display:none;align-items:center;justify-content:center;padding:18px;" +
      "background:radial-gradient(circle at 50% 40%,rgba(24,60,96,.6),rgba(3,7,13,.92) 62%);backdrop-filter:blur(14px);" +
      "font:14px Inter,system-ui,-apple-system,'Segoe UI',sans-serif}" +
      "#auraSiriOv.on{display:flex}" +
      "#auraSiriOv .asCard{width:100%;max-width:400px;text-align:center;color:#eaf6ff}" +
      "#auraSiriOv .asOrb{position:relative;width:132px;height:132px;margin:4px auto 18px;border-radius:50%;" +
      "background:conic-gradient(from 0deg,#4ad7ff,#7b6bff,#ff7ad9,#4ad7ff);box-shadow:0 0 46px rgba(74,215,255,.45),inset 0 0 34px rgba(4,12,22,.65);" +
      "animation:auraSiriSpin 7s linear infinite}" +
      "#auraSiriOv .asOrb::after{content:'';position:absolute;inset:16px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#0d2032,#050b13 70%)}" +
      "#auraSiriOv .asRing{position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(120,215,255,.35);opacity:0}" +
      "#auraSiriOv[data-state='listening'] .asRing{animation:auraSiriPulse 1.9s ease-out infinite}" +

      "#auraSiriOv .asRow button{min-width:96px;padding:11px 14px;border-radius:12px;border:1px solid rgba(120,215,255,.3);" +
      "background:rgba(120,215,255,.1);color:#dff4ff;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}" +
      "#auraSiriOv .asRow button.pr{background:linear-gradient(135deg,#48c8ff,#2f7bff);color:#04121f;border-color:transparent}" +
      "#auraSiriOv input{display:none;width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid rgba(120,215,255,.25);" +
      "background:rgba(255,255,255,.06);color:#eaf6ff;font:14px Inter,system-ui,sans-serif}" +
      "#auraSiriOv[data-type='1'] input{display:block}" +

  function siriListen(){

      for(var i = ev.resultIndex; i < ev.results.length; i++){
        if(ev.results[i].isFinal) finals += " " + ev.results[i][0].transcript;
        else interim += ev.results[i][0].transcript;

      o.connect(g); g.connect(ctx.destination);
      var t0 = ctx.currentTime;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.18, t0 + 0.02);
      g.gain.linearRampToValueAtTime(0, t0 + (dur || 0.16));
      o.start(t0); o.stop(t0 + (dur || 0.16) + 0.02);
    }catch(e){}

        if(left <= 0){

  window.__siriIntent = function(raw){
    var t = norm(raw); if(t.length < 2) return false;
    var m;
    if(/^(what('|’)?s the time|what is the time|what time is it|tell me the time|time kya|kya time|time batao|batao time|kitne baje|samay kya|kya samay)/i.test(t)){
      var s = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
      flash("🕒 " + s, 3000); say("It is " + s); return true;
    }
    if(/^(what('|’)?s the date|what is the date|what date is it|tell me the date|aaj ki tareekh|date kya|date batao|aaj kaunsi tarikh|today('|’)?s date)/i.test(t)){
      var s2 = new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" });
      flash("📅 " + s2, 3000); say(s2); return true;
    }
    m = t.match(/^(?:calculate|compute|what is|whats|how much is|kitna hota hai|kitna hai)\s+([-+*/().%\d\s]+)$/i);
    if(m){
      var v = evalMath(m[1]);
      if(v !== null){ var shown = Math.round(v * 1e6) / 1e6; flash("🧮 " + shown, 3500); say(String(shown)); return true; }
    }
    m = t.match(/(?:set\s+)?(?:a\s+)?timer\s+(?:for\s+|of\s+)?(\d+(?:\.\d+)?)\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?|ghanta|ghante|min)?/i) ||
        t.match(/(\d+(?:\.\d+)?)\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?|ghanta|ghante|min)\s*(?:ka|ke|ki)?\s*timer/i);
    if(m){
      var unit = String(m[2] || "minute").toLowerCase();
      var mult = /^(second|sec)/.test(unit) ? 1 / 60 : /^(hour|hr|ghant)/.test(unit) ? 60 : 1;
      setTimer(parseFloat(m[1]) * mult, "Timer");
      return true;
    }
    m = t.match(/^(?:set\s+)?(?:an?\s+)?(?:alarm|reminder|remind me|yaad dilana|yaad dilao)\s*(?:for|at|ko)?\s*(\d{1,2})[:.](\d{2})\s*(am|pm)?\s*(.*)$/i);
    if(m){
      var hh = parseInt(m[1], 10), mm = parseInt(m[2], 10);
      var ap = (m[3] || "").toLowerCase();
      if(ap === "pm" && hh < 12) hh += 12;
      if(ap === "am" && hh === 12) hh = 0;
      var when = new Date(); when.setHours(hh, mm, 0, 0);
      if(when.getTime() <= Date.now()) when.setDate(when.getDate() + 1);
      setTimer((when.getTime() - Date.now()) / 60000, String(m[4] || "").trim() || "Alarm");
      say("Alarm set for " + when.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }));
      return true;
    }
    m = t.match(/^(?:send\s+)?(?:a\s+)?(?:message|sms|msg|text)\s+(?:to\s+)?(.+?)(?:\s+(?:saying|that|ki|bolo|likho)\s+([\s\S]+))?$/i);
    if(m){
      var who = m[1].trim(), body = (m[2] || "").trim();
      var c0 = findContact(who);
      var num = c0 ? c0.t : digitsOf(who);
      if(digitsOf(num).length >= 6){
        var plus2 = String(num).trim().indexOf("+") === 0;
        var link = "sms:" + (plus2 ? "+" : "") + digitsOf(num) + (body ? "?body=" + encodeURIComponent(body) : "");
        flash("✉️ " + (c0 ? c0.n : num));
        say(body ? ("Message ready for " + (c0 ? c0.n : num)) : ("Opening messages for " + (c0 ? c0.n : num)));

    }
    m = t.match(/^(?:make a note|note this|note|yaad rakho|likh lo|remember)\s+([\s\S]+)$/i);
    if(m){
      try{
        var list = JSON.parse(localStorage.getItem(NOTES) || "[]");

        localStorage.setItem(NOTES, JSON.stringify(list.slice(-200)));
      }catch(e){}

    }
    m = t.match(/^(?:navigate|directions|take me|raasta|le chalo)\s+(?:to\s+)?([\s\S]+)$/i);
    if(m){

      try{ if(!window.open(url, "_blank")) location.href = url; }catch(e){ try{ location.href = url; }catch(e2){} }
      return true;
    }
    m = t.match(/^(?:call|dial|phone|milao|lagao)\s+([\s\S]+)$/i);
    if(m){
      var who2 = m[1].replace(/\s+(ko|se)\s*$/i, "").trim();
      if(/^(this|that)?\s*(person|contact|banda|aadmi|insaan)$/i.test(who2) || /^(isko|ise|usko)$/i.test(who2)){

    if(m){

      }

    }

  };

  /* ---------------- the ear ---------------- */
  function wakeListen(){
    if(!V.armed || !SR) return;
    clearTimeout(V.timer);
